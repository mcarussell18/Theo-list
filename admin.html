<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theo Admin</title><style>body{margin:0;background:#f8fafc;color:#111827;font:16px/1.5 system-ui}.w{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin:12px 0}input,textarea,button{font:inherit}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d1d5db;border-radius:10px;margin:5px 0 10px}button{padding:10px 14px;border:0;border-radius:10px;background:#111827;color:white;font-weight:750;margin:4px}.secondary{background:#fff;color:#111827;border:1px solid #d1d5db}.danger{background:#b91c1c}textarea{width:100%;box-sizing:border-box;min-height:340px;padding:12px;border:1px solid #d1d5db;border-radius:12px;font-family:ui-monospace,monospace;font-size:13px}.hidden{display:none}.ok{color:#166534}.bad{color:#991b1b}.muted{color:#6b7280}.row{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><main class="w"><h1>Theo Firestore Admin</h1><section id="login" class="card"><h2>Sign in</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signIn">Sign in</button><div id="loginStatus" class="muted"></div></section><section id="panel" class="hidden"><div class="card"><div class="row"><button id="load">Load current</button><button id="backup">Create backup</button><button id="download" class="secondary">Download JSON</button><button id="restore" class="danger">Replace Firestore with JSON below</button><button id="signOut" class="secondary">Sign out</button></div><p id="status" class="muted">Signed in.</p></div><div class="card"><b>Document: checklists/teo</b><p id="stats" class="muted"></p><textarea id="json"></textarea></div><div class="card"><a href="./checklist.html">Open checklist</a></div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';const cfg={apiKey:'AIzaSyAhs2ANKnzeaGtlMA89FOuM5TiEpjTWTRQ',authDomain:'teo-checklist.firebaseapp.com',projectId:'teo-checklist',storageBucket:'teo-checklist.firebasestorage.app',messagingSenderId:'174394084827',appId:'1:174394084827:web:2ed6db19c135cb25362bfe'};const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),target=doc(db,'checklists','teo');const $=id=>document.getElementById(id);let current=null;function stats(o){const d=o?.data;if(!Array.isArray(d))return'No valid data array';const items=d.flatMap(s=>(s.g||[]).flatMap(g=>g.i||[]));return`${d.length} sections · ${items.length} items · ${items.filter(x=>x.d===true).length} checked`}function dl(name,obj){const u=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function load(){try{$('status').textContent='Loading…';const s=await getDoc(target);if(!s.exists())throw Error('checklists/teo does not exist');current=s.data();$('json').value=JSON.stringify(current,null,2);$('stats').textContent=stats(current);$('status').innerHTML='<span class="ok">Loaded from Firestore.</span>'}catch(e){$('status').innerHTML='<span class="bad">'+e.message+'</span>'}}$('signIn').onclick=async()=>{try{$('loginStatus').textContent='Signing in…';await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('loginStatus').textContent=''}catch(e){$('loginStatus').textContent=e.message}};$('signOut').onclick=()=>signOut(auth);$('load').onclick=load;$('download').onclick=()=>{if(current)dl('theo-current-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json',current)};$('backup').onclick=async()=>{try{const s=await getDoc(target);if(!s.exists())throw Error('No current document');const stamp=new Date().toISOString().replace(/[:.]/g,'-'),payload=s.data();await setDoc(doc(db,'checklists','backup-manual-'+stamp),{kind:'manual-backup',savedAt:serverTimestamp(),source:'checklists/teo',payload});dl('theo-backup-'+stamp+'.json',payload);$('status').innerHTML='<span class="ok">Backup saved in Firestore and downloaded.</span>'}catch(e){$('status').innerHTML='<span class="bad">'+e.message+'</span>'}};$('restore').onclick=async()=>{if(!confirm('Replace checklists/teo with the JSON shown?'))return;try{const obj=JSON.parse($('json').value);if(!Array.isArray(obj.data))throw Error('JSON must contain a data array');const stamp=new Date().toISOString().replace(/[:.]/g,'-'),before=await getDoc(target);if(before.exists())await setDoc(doc(db,'checklists','backup-before-admin-restore-'+stamp),{kind:'pre-restore-backup',savedAt:serverTimestamp(),payload:before.data()});await setDoc(target,obj,{merge:false});const verify=await getDoc(target);current=verify.data();$('stats').textContent=stats(current);$('status').innerHTML='<span class="ok">Restored and read back successfully.</span>'}catch(e){$('status').innerHTML='<span class="bad">'+e.message+'</span>'}};onAuthStateChanged(auth,u=>{if(u){$('login').classList.add('hidden');$('panel').classList.remove('hidden');load()}else{$('login').classList.remove('hidden');$('panel').classList.add('hidden')}});</script></body></html>
