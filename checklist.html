<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theo Checklist</title><style>body{margin:0;background:#f8fafc;color:#111827;font-family:system-ui}header{position:sticky;top:0;background:#fffffff2;border-bottom:1px solid #e5e7eb}.w,main{max-width:760px;margin:auto}.w{padding:14px}main{padding:12px}.sec{background:white;border:1px solid #e5e7eb;border-radius:18px;margin-bottom:10px;overflow:hidden}summary{padding:14px 16px;font-weight:800;display:flex;justify-content:space-between}.grp{padding:0 12px 12px}.gt{font-size:.78rem;color:#6b7280;font-weight:800;text-transform:uppercase;margin:10px 4px}.row{display:flex;gap:10px;align-items:flex-start;border-top:1px solid #f1f5f9;padding:11px 4px}.done .ttl{text-decoration:line-through;color:#6b7280}input[type=checkbox]{width:22px;height:22px;accent-color:#16a34a}.hidden{display:none}.card{max-width:420px;margin:40px auto;background:white;border:1px solid #e5e7eb;border-radius:18px;padding:18px}input,button{font:inherit}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d1d5db;border-radius:10px;margin:5px 0 10px}button{border:0;border-radius:10px;padding:10px 14px;background:#111827;color:#fff;font-weight:750}.muted{font-size:.85rem;color:#6b7280}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.links a{margin-right:10px}</style></head><body><section id="login" class="card"><h1>Theo List</h1><p>Sign in to view the checklist.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signIn">Sign in</button><p id="loginStatus" class="muted"></p></section><div id="appShell" class="hidden"><header><div class="w"><div class="top"><div><h1 style="margin:0">Checklist for Theo ✅</h1><div id="count" class="muted">Loading…</div></div><button id="signOut">Sign out</button></div><div class="links"><a href="./admin.html">Admin & backups</a></div><div id="status" class="muted">Connecting…</div></div></header><main id="app"></main></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';import{getFirestore,doc,onSnapshot,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';const cfg={apiKey:'AIzaSyAhs2ANKnzeaGtlMA89FOuM5TiEpjTWTRQ',authDomain:'teo-checklist.firebaseapp.com',projectId:'teo-checklist',storageBucket:'teo-checklist.firebasestorage.app',messagingSenderId:'174394084827',appId:'1:174394084827:web:2ed6db19c135cb25362bfe'};const fb=initializeApp(cfg),auth=getAuth(fb),db=getFirestore(fb),ref=doc(db,'checklists','teo');const $=id=>document.getElementById(id);let data=[],unsub=null;const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const root=$('app');root.innerHTML='';let all=[];data.forEach((s,si)=>{const items=(s.g||[]).flatMap(g=>g.i||[]);all.push(...items);const d=document.createElement('details');d.className='sec';d.open=true;d.innerHTML=`<summary><span>${esc(s.t)}</span><span>${items.filter(x=>x.d===true).length}/${items.length}</span></summary>`;(s.g||[]).forEach((g,gi)=>{const wrap=document.createElement('div');wrap.className='grp';wrap.innerHTML=(g.t?`<div class="gt">${esc(g.t)}</div>`:'')+(g.i||[]).map((it,ii)=>`<label class="row ${it.d===true?'done':''}"><input type="checkbox" data-s="${si}" data-g="${gi}" data-i="${ii}" ${it.d===true?'checked':''}><span class="ttl">${esc(it.t)}</span></label>`).join('');d.appendChild(wrap)});root.appendChild(d)});$('count').textContent=`${all.filter(x=>x.d===true).length}/${all.length} done`}async function save(){await setDoc(ref,{data,updatedAt:serverTimestamp()},{merge:false})}$('signIn').onclick=async()=>{try{$('loginStatus').textContent='Signing in…';await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){$('loginStatus').textContent=e.message}};$('signOut').onclick=()=>signOut(auth);document.addEventListener('change',async e=>{if(e.target.type!=='checkbox')return;const d=e.target.dataset;data[d.s].g[d.g].i[d.i].d=e.target.checked;render();$('status').textContent='Saving…';try{await save();$('status').textContent='Saved and synced'}catch(err){$('status').textContent=err.message}});onAuthStateChanged(auth,u=>{if(u){$('login').classList.add('hidden');$('appShell').classList.remove('hidden');if(unsub)unsub();unsub=onSnapshot(ref,s=>{if(!s.exists()){$('status').textContent='Checklist document missing';return}const raw=s.data();if(!Array.isArray(raw.data)){$('status').textContent='Invalid Firestore schema';return}data=raw.data;render();$('status').textContent='Live sync connected'},e=>$('status').textContent=e.message)}else{if(unsub){unsub();unsub=null}$('login').classList.remove('hidden');$('appShell').classList.add('hidden')}});</script></body></html>
