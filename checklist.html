<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Theo Checklist</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--soft:#f1f5f9;--ok:#16a34a;--bad:#b91c1c;--ink:#111827;--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{position:sticky;top:0;z-index:9;background:#fffffff2;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.w,main{max-width:760px;margin:auto}.w{padding:14px}main{padding:12px 12px 72px}h1{font-size:1.28rem;margin:0}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted,#count,#status{font-size:.84rem;color:var(--muted)}progress{height:9px;width:100%;accent-color:var(--ok)}button{font:inherit;border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:#fff;color:var(--ink);font-weight:750;white-space:nowrap}.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.danger{color:var(--bad)}.hidden{display:none!important}.login{max-width:420px;margin:42px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.login input,.field,textarea,select{width:100%;border:1px solid #d1d5db;border-radius:12px;padding:10px;font:inherit;background:#fff}.login input{margin:5px 0 10px}.links,.actions{display:flex;gap:8px;overflow:auto;padding-top:9px}.sec{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden}summary{list-style:none;padding:14px 16px;font-weight:850;display:flex;justify-content:space-between;gap:12px;cursor:pointer}summary::-webkit-details-marker{display:none}.badge{font-size:.78rem;color:var(--muted);font-weight:800}.grp{padding:0 12px 12px}.gt{font-size:.78rem;color:var(--muted);font-weight:850;text-transform:uppercase;letter-spacing:.05em;margin:10px 4px}.row{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--soft);padding:11px 4px;cursor:pointer}.row:first-child{border-top:0}input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);flex:0 0 auto;cursor:pointer}.body{flex:1;min-width:0}.titleline{display:flex;gap:6px;align-items:flex-start}.ttl{line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;flex:1}.row.open .ttl{display:block;overflow:visible}.done .ttl{text-decoration:line-through;color:var(--muted)}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}.chip{font-size:.74rem;font-weight:800;border-radius:999px;padding:3px 7px;background:#eef2ff;color:#3730a3}.chip.price{background:#ecfdf5;color:#166534}.chip.must{background:#fef2f2;color:#991b1b}.chip.nice{background:#fffbeb;color:#92400e}.chip.bought{background:#f0fdf4;color:#166534}.preview{font-size:.84rem;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:none;margin-top:8px;font-size:.88rem;color:var(--muted);white-space:pre-wrap;background:#f8fafc;border:1px solid #eef2f7;border-radius:12px;padding:9px}.row.open .meta{display:block}.meta a{color:var(--blue);font-weight:800;text-decoration:none}.chev{font-size:.9rem;color:#9ca3af;padding-top:2px}.row.open .chev{transform:rotate(90deg)}.empty{color:var(--muted);font-size:.9rem;padding:8px 4px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:end;padding:12px;z-index:20}.modal.on{display:flex}.box{background:white;border-radius:22px 22px 14px 14px;width:100%;max-width:620px;margin:auto;padding:16px;box-shadow:0 18px 50px #0004}.box h2{margin:0 0 12px}.box label{display:block;font-size:.82rem;font-weight:850;color:var(--muted);margin:9px 0 5px}textarea{min-height:90px;resize:vertical}.err{display:none;background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:12px;padding:10px;margin-top:10px}.notice{display:none;background:#eff6ff;color:#1e3a8a;border:1px solid #bfdbfe;border-radius:12px;padding:10px;margin-top:10px}.notice.on{display:block}@media(min-width:700px){.modal{align-items:center}.box{border-radius:22px}}
</style>
</head>
<body>
<section id="login" class="login"><h1>Theo List</h1><p>Sign in to view the checklist.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signIn" class="primary">Sign in</button><p id="loginStatus" class="muted"></p></section>
<div id="appShell" class="hidden"><header><div class="w"><div class="top"><div style="flex:1"><h1>Checklist for Theo</h1><progress id="prog" max="100" value="0"></progress><div id="count">Loading...</div></div><button id="signOut">Sign out</button></div><div class="links"><a href="./admin.html">Admin & backups</a><button id="backupNow">Back up</button><button id="downloadLast" class="hidden">Download migration backup</button></div><div id="status">Connecting...</div><div class="muted">Tap item text to expand. Hold an item, header, or section to edit. Checkbox only changes the tick.</div><div id="notice" class="notice"></div><div id="err" class="err"></div></div></header><main id="app"></main></div>
<div class="modal" id="modal"><div class="box"><h2 id="mh">Edit</h2><label>Name</label><input class="field" id="nm"><label>Notes / things to consider</label><textarea id="nt" placeholder="Brand, size, what to check, why this matters..."></textarea><label>Product or reference link</label><input class="field" id="ur" placeholder="https://..."><label>Price</label><input class="field" id="pr" placeholder="£0"><label>Priority</label><select id="py"><option value="">No priority</option><option value="must">Must buy</option><option value="nice">Nice to have</option><option value="bought">Bought</option></select><div class="actions"><button class="primary" id="saveEdit">Save</button><button class="danger" id="deleteEdit">Delete</button><button id="closeEdit">Cancel</button></div></div></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';import{getFirestore,doc,onSnapshot,setDoc,getDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
const cfg={apiKey:'AIzaSyAhs2ANKnzeaGtlMA89FOuM5TiEpjTWTRQ',authDomain:'teo-checklist.firebaseapp.com',projectId:'teo-checklist',storageBucket:'teo-checklist.firebasestorage.app',messagingSenderId:'174394084827',appId:'1:174394084827:web:2ed6db19c135cb25362bfe'};
const fb=initializeApp(cfg),auth=getAuth(fb),db=getFirestore(fb),ref=doc(db,'checklists','teo');const $=id=>document.getElementById(id);const RICH_SCHEMA='rich-fields-v1';let data=[],unsub=null,timer=null,target=null,saving=false,lastMigrationBackup=null,seenMigration=false,openRows=new Set(JSON.parse(localStorage.getItem('theo-open-rows')||'[]'));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const truthy=v=>v===true||v===1||v==='1'||v==='true'||v==='yes'||v==='done'||v==='checked';const noteFirst=n=>String(n||'').split(/\r?\n/).find(Boolean)||'';const itemId=(si,gi,ii)=>`${si}-${gi}-${ii}`;function storeOpen(){localStorage.setItem('theo-open-rows',JSON.stringify([...openRows]))}function showErr(m){$('err').style.display='block';$('err').textContent=m}function clearErr(){$('err').style.display='none'}function download(name,obj){const u=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function richItem(x){if(Array.isArray(x))return{t:String(x[0]??'Untitled item'),d:truthy(x[1]),n:'',u:'',price:'',priority:''};if(typeof x==='string')return{t:x,d:false,n:'',u:'',price:'',priority:''};const o=x&&typeof x==='object'?x:{};return{...o,t:String(o.t??o.text??o.name??o.title??o.label??'Untitled item'),d:truthy(o.d??o.done??o.checked??o.completed??false),n:String(o.n??o.note??o.notes??o.description??''),u:String(o.u??o.url??o.link??o.productUrl??''),price:String(o.price??o.p??o.cost??''),priority:String(o.priority??o.r??'')}}
function richGroup(g){const o=g&&typeof g==='object'?g:{};return{...o,t:String(o.t??o.title??o.name??''),n:String(o.n??o.note??o.notes??''),u:String(o.u??o.url??o.link??''),i:Array.isArray(o.i)?o.i.map(richItem):[]}}function richSection(s){const o=s&&typeof s==='object'?s:{};return{...o,t:String(o.t??o.title??o.name??'Untitled section'),n:String(o.n??o.note??o.notes??''),u:String(o.u??o.url??o.link??''),g:Array.isArray(o.g)?o.g.map(richGroup):[]}}function upgrade(raw){const list=Array.isArray(raw?.data)?raw.data:[];return{...raw,data:list.map(richSection),schemaVersion:RICH_SCHEMA,upgradedAt:serverTimestamp()}}function needsUpgrade(raw){if(!Array.isArray(raw?.data))return false;if(raw.schemaVersion===RICH_SCHEMA)return false;return raw.data.some(s=>(s.g||[]).some(g=>(g.i||[]).some(it=>Array.isArray(it)||typeof it==='string'||it.price===undefined||it.priority===undefined||it.n===undefined||it.u===undefined)))}function counts(list=data){const all=list.flatMap(s=>(s.g||[]).flatMap(g=>g.i||[]));return{all,done:all.filter(x=>x.d===true).length,total:all.length}}function obj(el){const d=el.dataset;if(d.k==='s')return data[d.s];if(d.k==='g')return data[d.s].g[d.g];return data[d.s].g[d.g].i[d.i]}function linkHtml(u){return u?`<div><a href="${esc(u)}" target="_blank" rel="noopener">Open link</a></div>`:''}function priorityLabel(v){return({must:'Must buy',nice:'Nice to have',bought:'Bought'})[v]||''}
function render(){const root=$('app');root.innerHTML='';const c=counts();data.forEach((s,si)=>{const items=(s.g||[]).flatMap(g=>g.i||[]);const done=items.filter(x=>x.d===true).length;const sec=document.createElement('details');sec.className='sec';sec.open=true;sec.innerHTML=`<summary data-k="s" data-s="${si}"><span>${esc(s.t)}</span><span class="badge">${done}/${items.length}</span></summary>`;if(s.n||s.u)sec.innerHTML+=`<div class="note">${esc(s.n)}${linkHtml(s.u)}</div>`;(s.g||[]).forEach((g,gi)=>{const wrap=document.createElement('div');wrap.className='grp';let html=g.t?`<div class="gt" data-k="g" data-s="${si}" data-g="${gi}">${esc(g.t)}</div>`:'';if(g.n||g.u)html+=`<div class="note">${esc(g.n)}${linkHtml(g.u)}</div>`;html+=(g.i||[]).map((it,ii)=>{const id=itemId(si,gi,ii),note=noteFirst(it.n),prio=priorityLabel(it.priority);const chips=[it.u?'<span class="chip">Product link</span>':'',it.price?`<span class="chip price">${esc(it.price)}</span>`:'',prio?`<span class="chip ${esc(it.priority)}">${esc(prio)}</span>`:''].join('');const meta=(it.n||it.u||it.price||prio)?`<div class="meta">${it.n?esc(it.n):'No notes yet.'}${linkHtml(it.u)}${it.price?`<div><b>Price:</b> ${esc(it.price)}</div>`:''}${prio?`<div><b>Priority:</b> ${esc(prio)}</div>`:''}</div>`:'<div class="meta">No extra notes, price, priority, or link yet. Hold this item to add details.</div>';return `<div class="row ${it.d?'done ':''}${openRows.has(id)?'open':''}" data-k="i" data-s="${si}" data-g="${gi}" data-i="${ii}"><input type="checkbox" ${it.d?'checked':''}><div class="body"><div class="titleline"><div class="ttl">${esc(it.t)}</div></div>${chips?`<div class="chips">${chips}</div>`:''}${note?`<div class="preview">${esc(note)}</div>`:''}${meta}</div><div class="chev">›</div></div>`}).join('');html+=`<div class="actions"><button data-add-item="${si},${gi}">Add item</button></div>`;wrap.innerHTML=html;sec.appendChild(wrap)});sec.innerHTML+=`<div class="actions" style="padding:8px 12px 14px"><button data-add-group="${si}">Add header</button><button class="danger" data-del-section="${si}">Remove section</button></div>`;root.appendChild(sec)});$('prog').value=c.total?c.done/c.total*100:0;$('count').textContent=`${c.done}/${c.total} done`}
async function save(){saving=true;$('status').textContent='Saving...';try{await setDoc(ref,{data,schemaVersion:RICH_SCHEMA,updatedAt:serverTimestamp()},{merge:false});$('status').textContent='Saved and synced';clearErr()}catch(e){showErr('Could not save: '+e.message);$('status').textContent='Save failed'}finally{saving=false}}async function createBackup(kind='manual-backup'){const snap=await getDoc(ref);if(!snap.exists())throw Error('No checklist document to back up');const payload=snap.data(),stamp=new Date().toISOString().replace(/[:.]/g,'-');await setDoc(doc(db,'checklists',`${kind}-${stamp}`),{kind,source:'checklists/teo',savedAt:serverTimestamp(),payload});download(`theo-${kind}-${stamp}.json`,payload);return payload}async function maybeUpgrade(raw){if(!needsUpgrade(raw)){data=(raw.data||[]).map(richSection);return}if(seenMigration)return;seenMigration=true;$('status').textContent='Backing up before adding rich item fields...';const stamp=new Date().toISOString().replace(/[:.]/g,'-');await setDoc(doc(db,'checklists',`backup-before-rich-fields-${stamp}`),{kind:'backup-before-rich-fields',source:'checklists/teo',savedAt:serverTimestamp(),payload:raw});lastMigrationBackup={name:`theo-before-rich-fields-${stamp}.json`,payload:raw};$('downloadLast').classList.remove('hidden');$('notice').classList.add('on');$('notice').textContent='A pre-migration backup was saved in Firestore. Use “Download migration backup” to keep a local copy too.';const upgraded=upgrade(raw);data=upgraded.data;await setDoc(ref,upgraded,{merge:false})}
$('signIn').onclick=async()=>{try{$('loginStatus').textContent='Signing in...';await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){$('loginStatus').textContent=e.message}};$('signOut').onclick=()=>signOut(auth);$('backupNow').onclick=async()=>{try{$('status').textContent='Creating backup...';await createBackup();$('status').textContent='Backup saved and downloaded'}catch(e){showErr(e.message)}};$('downloadLast').onclick=()=>{if(lastMigrationBackup)download(lastMigrationBackup.name,lastMigrationBackup.payload)};
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-k]');if(!el||e.target.type==='checkbox'||e.target.tagName==='A')return;timer=setTimeout(()=>edit(el),650)});document.addEventListener('pointerup',()=>clearTimeout(timer));document.addEventListener('pointercancel',()=>clearTimeout(timer));document.addEventListener('contextmenu',e=>{const el=e.target.closest('[data-k]');if(el){e.preventDefault();edit(el)}});document.addEventListener('change',e=>{if(e.target.type!=='checkbox')return;const row=e.target.closest('.row');if(!row)return;const d=row.dataset;data[d.s].g[d.g].i[d.i].d=e.target.checked;render();save()});document.addEventListener('click',e=>{const b=e.target.closest('button');if(b){if(b.dataset.addItem){const[si,gi]=b.dataset.addItem.split(',').map(Number),v=prompt('Item name?');if(v){data[si].g[gi].i.push({t:v,d:false,n:'',u:'',price:'',priority:''});render();save()}}if(b.dataset.addGroup){const v=prompt('Header name?','New header');if(v!==null){data[+b.dataset.addGroup].g.push({t:v,n:'',u:'',i:[]});render();save()}}if(b.dataset.delSection&&confirm('Remove this section?')){data.splice(+b.dataset.delSection,1);render();save()}return}const row=e.target.closest('.row');if(row&&e.target.type!=='checkbox'&&e.target.tagName!=='A'){const d=row.dataset,id=itemId(d.s,d.g,d.i);openRows.has(id)?openRows.delete(id):openRows.add(id);storeOpen();render()}});function edit(el){target=el;const o=obj(el);$('mh').textContent=el.dataset.k==='i'?'Edit item':'Edit header/section';$('nm').value=o.t||'';$('nt').value=o.n||'';$('ur').value=o.u||'';$('pr').value=o.price||o.p||'';$('py').value=o.priority||o.r||'';$('modal').classList.add('on')}$('saveEdit').onclick=()=>{const o=obj(target);o.t=$('nm').value.trim()||'Untitled';o.n=$('nt').value.trim();o.u=$('ur').value.trim();if(target.dataset.k==='i'){o.price=$('pr').value.trim();o.priority=$('py').value}$('modal').classList.remove('on');render();save()};$('deleteEdit').onclick=()=>{if(!target||!confirm('Delete this?'))return;const d=target.dataset;if(d.k==='s')data.splice(d.s,1);else if(d.k==='g')data[d.s].g.splice(d.g,1);else data[d.s].g[d.g].i.splice(d.i,1);$('modal').classList.remove('on');render();save()};$('closeEdit').onclick=()=>$('modal').classList.remove('on');
onAuthStateChanged(auth,u=>{if(u){$('login').classList.add('hidden');$('appShell').classList.remove('hidden');if(unsub)unsub();unsub=onSnapshot(ref,async snap=>{if(!snap.exists()){$('status').textContent='Checklist document missing';return}const raw=snap.data();if(!Array.isArray(raw.data)){$('status').textContent='Invalid Firestore schema';return}try{await maybeUpgrade(raw);render();$('status').textContent=saving?'Saving...':'Live sync connected';clearErr()}catch(e){showErr('Migration/save failed: '+e.message);data=(raw.data||[]).map(richSection);render();$('status').textContent='Loaded without upgrading'}},e=>{$('status').textContent=e.message;showErr(e.message)})}else{if(unsub){unsub();unsub=null}$('login').classList.remove('hidden');$('appShell').classList.add('hidden')}});
</script>
</body>
</html>
