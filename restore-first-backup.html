<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restore Theo backup</title><style>body{font:16px/1.45 system-ui;margin:0;background:#f6f4ef;color:#272727}.wrap{max-width:680px;margin:auto;padding:24px}.card{background:white;border:1px solid #e5dfd5;border-radius:16px;padding:18px;box-shadow:0 8px 24px #0000000d}h1{margin-top:0}.ok{color:#286347}.bad{color:#9b332d}pre{white-space:pre-wrap;background:#f7f5f0;padding:12px;border-radius:10px}</style></head><body><div class="wrap"><div class="card"><h1>Restoring earliest Theo backup</h1><div id="status">Connecting to Firebase…</div></div></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';import{getFirestore,collection,getDocs,doc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';const cfg={apiKey:'AIzaSyAhs2ANKnzeaGtlMA89FOuM5TiEpjTWTRQ',authDomain:'teo-checklist.firebaseapp.com',projectId:'teo-checklist',storageBucket:'teo-checklist.firebasestorage.app',messagingSenderId:'174394084827',appId:'1:174394084827:web:2ed6db19c135cb25362bfe'};const status=document.getElementById('status');const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));try{const db=getFirestore(initializeApp(cfg));const snap=await getDocs(collection(db,'checklist-backups'));if(!snap.size){status.innerHTML='<b class="bad">No backups were found.</b><p>The checklist-backups collection is empty or blocked by Firestore rules.</p>';throw new Error('No backups found')}const docs=[];snap.forEach(d=>docs.push({id:d.id,data:d.data()}));docs.sort((a,b)=>a.id.localeCompare(b.id));const chosen=docs[0];status.innerHTML=`Found ${docs.length} backup(s).<br>Using earliest backup: <b>${esc(chosen.id)}</b><br><br>Creating a safety copy of the current checklist…`;const target=doc(db,'checklists','teo');const current=await getDoc(target);const stamp=new Date().toISOString().replace(/[:.]/g,'-');if(current.exists())await setDoc(doc(db,'checklist-backups',`pre-auto-restore-${stamp}`),{source:'automatic-earliest-backup-restore',createdAt:serverTimestamp(),data:current.data()});const raw=chosen.data?.data??chosen.data;await setDoc(target,raw);status.innerHTML=`<b class="ok">Restore complete.</b><p>Restored exact backup: <b>${esc(chosen.id)}</b></p><p><a href="./?restored=1">Open Theo checklist</a></p>`;}catch(e){console.error(e);if(!status.innerHTML.includes('No backups'))status.innerHTML=`<b class="bad">Restore failed.</b><pre>${esc(e.message)}</pre>`}</script></body></html>
