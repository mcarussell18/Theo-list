<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theo Notepad</title><style>:root{--bg:#f8fafc;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--blue:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.w,main{max-width:820px;margin:auto}.w{padding:14px}main{padding:12px 12px 72px}header{position:sticky;top:0;z-index:5;background:#fffffff2;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}h1{font-size:1.3rem;margin:0}.top,.nav,.actions{display:flex;gap:8px;align-items:center}.top{justify-content:space-between}.nav,.actions{overflow:auto;padding-top:9px}a{color:var(--blue);font-weight:750;text-decoration:none}button{font:inherit;border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:white;font-weight:750;white-space:nowrap}.primary{background:var(--ink);border-color:var(--ink);color:white}.muted,#status{font-size:.84rem;color:var(--muted)}.login,.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px}.login{max-width:420px;margin:42px auto}.hidden{display:none!important}input,textarea{width:100%;border:1px solid #d1d5db;border-radius:12px;padding:10px;font:inherit;background:white}textarea{min-height:58vh;resize:vertical;line-height:1.45}label{font-size:.82rem;font-weight:850;color:var(--muted);display:block;margin:9px 0 5px}.ok{color:#166534}.bad{color:#991b1b}</style></head><body><section id="login" class="login"><h1>Theo Notepad</h1><p>Sign in to view the shared notes.</p><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button id="signIn" class="primary">Sign in</button><p id="loginStatus" class="muted"></p></section><div id="shell" class="hidden"><header><div class="w"><div class="top"><div><h1>Theo Notepad</h1><div id="status">Connecting...</div></div><button id="signOut">Sign out</button></div><div class="nav"><a href="./checklist.html">Checklist</a><a href="./calendar.html">Calendar</a><a href="./admin.html">Admin</a><button id="save" class="primary">Save now</button><button id="backup">Back up</button></div></div></header><main><section class="card"><label>Shared notes</label><textarea id="note" placeholder="Things to remember, questions for appointments, product thoughts, birth prep notes..."></textarea><p class="muted">Autosaves shortly after you stop typing. Everyone signed in sees the same note.</p></section></main></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';import{getFirestore,doc,onSnapshot,setDoc,getDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';const cfg={apiKey:'AIzaSyAhs2ANKnzeaGtlMA89FOuM5TiEpjTWTRQ',authDomain:'teo-checklist.firebaseapp.com',projectId:'teo-checklist',storageBucket:'teo-checklist.firebasestorage.app',messagingSenderId:'174394084827',appId:'1:174394084827:web:2ed6db19c135cb25362bfe'};const fb=initializeApp(cfg),auth=getAuth(fb),db=getFirestore(fb),ref=doc(db,'checklists','notepad');const $=id=>document.getElementById(id);let unsub=null,timer=null,remoteText='',saving=false;function dl(name,obj){const u=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function write(){saving=true;$('status').textContent='Saving...';await setDoc(ref,{text:$('note').value,updatedAt:serverTimestamp(),schemaVersion:'notepad-v1'},{merge:true});remoteText=$('note').value;saving=false;$('status').textContent='Saved and synced'}async function backup(){const s=await getDoc(ref),stamp=new Date().toISOString().replace(/[:.]/g,'-'),payload=s.exists()?s.data():{text:$('note').value};await setDoc(doc(db,'checklists','backup-notepad-'+stamp),{kind:'notepad-backup',source:'checklists/notepad',savedAt:serverTimestamp(),payload});dl('theo-notepad-'+stamp+'.json',payload);$('status').textContent='Backup saved and downloaded'}$('note').addEventListener('input',()=>{clearTimeout(timer);$('status').textContent='Unsaved changes...';timer=setTimeout(()=>write().catch(e=>$('status').textContent=e.message),850)});$('save').onclick=()=>write().catch(e=>$('status').textContent=e.message);$('backup').onclick=()=>backup().catch(e=>$('status').textContent=e.message);$('signIn').onclick=async()=>{try{$('loginStatus').textContent='Signing in...';await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){$('loginStatus').textContent=e.message}};$('signOut').onclick=()=>signOut(auth);onAuthStateChanged(auth,u=>{if(u){$('login').classList.add('hidden');$('shell').classList.remove('hidden');if(unsub)unsub();unsub=onSnapshot(ref,async s=>{if(!s.exists()){await setDoc(ref,{text:'',createdAt:serverTimestamp(),schemaVersion:'notepad-v1'});return}const text=String(s.data().text||'');remoteText=text;if(!saving&&document.activeElement!==$('note'))$('note').value=text;$('status').textContent='Live sync connected'},e=>$('status').textContent=e.message)}else{if(unsub)unsub();$('login').classList.remove('hidden');$('shell').classList.add('hidden')}});</script></body></html>
