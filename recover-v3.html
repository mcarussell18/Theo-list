<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theo recovery v3</title><style>body{font-family:system-ui;margin:0;background:#f6f4ef;color:#222}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #ddd3c5;border-radius:16px;padding:16px;margin:14px 0}.restore{display:block;width:100%;margin:14px 0 8px;padding:15px;border:0;border-radius:12px;background:#176b4d;color:#fff;font-weight:800;font-size:17px}.raw{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f0ea;padding:10px;border-radius:10px;max-height:300px;overflow:auto}.muted{color:#6f6f6f}.bad{color:#9d2d2d;font-weight:700}.good{color:#176b4d;font-weight:700}</style></head><body><main class="wrap"><h1>Theo data recovery v3</h1><p class="muted">Every Firebase document below has a restore button. A backup is created first.</p><div id="status" class="card">Loading…</div><div id="docs"></div><p><a href="./">Back to checklist</a></p></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';import{getFirestore,collection,getDocs,doc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';const config={apiKey:'AIzaSyAhs2ANKnzeaGtlMA89FOuM5TiEpjTWTRQ',authDomain:'teo-checklist.firebaseapp.com',projectId:'teo-checklist',storageBucket:'teo-checklist.firebasestorage.app',messagingSenderId:'174394084827',appId:'1:174394084827:web:2ed6db19c135cb25362bfe'};const db=getFirestore(initializeApp(config)),docsEl=document.querySelector('#docs'),status=document.querySelector('#status');const esc=v=>String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function item(x){if(typeof x==='string')return{name:x,done:false,note:'',price:'',url:'',priority:''};x=x||{};return{name:x.name||x.title||x.text||x.label||x.item||'Untitled item',done:!!(x.done||x.checked||x.completed||x.complete||x.isDone),note:x.note||x.notes||x.description||x.details||'',price:x.price||x.cost||'',url:x.url||x.link||x.productUrl||'',priority:x.priority||''}}function parse(raw){if(Array.isArray(raw?.sections))return raw.sections.map((s,i)=>({title:s.title||s.name||`Section ${i+1}`,items:Array.isArray(s.items)?s.items.map(item):[]}));for(const key of ['checklist','groups','categories','list','items']){const a=raw?.[key];if(Array.isArray(a)){if(key==='items')return[{title:'Checklist',items:a.map(item)}];return a.map((s,i)=>Array.isArray(s)?{title:`Section ${i+1}`,items:s.map(item)}:{title:s.title||s.name||s.heading||`Section ${i+1}`,items:(s.items||s.children||s.entries||s.tasks||[]).map(item)})}}const out=[];for(const[k,v]of Object.entries(raw||{})){if(Array.isArray(v))out.push({title:k,items:v.map(item)});else if(v&&typeof v==='object'){const a=v.items||v.children||v.entries||v.tasks||v.list;if(Array.isArray(a))out.push({title:v.title||v.name||k,items:a.map(item)})}}return out}async function backup(){const target=doc(db,'checklists','teo'),current=await getDoc(target);if(current.exists()){const stamp=new Date().toISOString().replace(/[:.]/g,'-');await setDoc(doc(db,'checklist-backups',`teo-${stamp}`),{source:'recover-v3',createdAt:serverTimestamp(),data:current.data()})}}async function restore(id,raw){const sections=parse(raw),count=sections.reduce((n,s)=>n+s.items.length,0);const msg=count?`Restore ${count} converted items from “${id}”?`:`No sections were recognised. Restore the raw document “${id}” anyway?`;if(!confirm(msg))return;await backup();await setDoc(doc(db,'checklists','teo'),count?{sections}:raw);alert('Restore complete. Now open the main checklist.');location.href='./?restored='+Date.now()}try{const snap=await getDocs(collection(db,'checklists'));status.innerHTML=`<span class="good">Loaded ${snap.size} document(s)</span>`;snap.forEach(d=>{const raw=d.data(),sections=parse(raw),count=sections.reduce((n,s)=>n+s.items.length,0),card=document.createElement('section');card.className='card';card.innerHTML=`<h2>${esc(d.id)}</h2><p><b>${sections.length} parsed sections · ${count} parsed items</b></p><button class="restore">RESTORE THIS DOCUMENT</button><details><summary>Show stored data</summary><pre class="raw">${esc(JSON.stringify(raw,null,2))}</pre></details>`;card.querySelector('button').onclick=()=>restore(d.id,raw);docsEl.appendChild(card)})}catch(e){status.innerHTML=`<span class="bad">Error: ${esc(e.message)}</span>`}</script></body></html>
