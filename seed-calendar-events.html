<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add trial Theo events</title><style>body{margin:0;background:#f8fafc;color:#111827;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.w{max-width:680px;margin:auto;padding:22px}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin:12px 0}input,button{font:inherit}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d1d5db;border-radius:10px;margin:5px 0 10px}button{border:0;border-radius:12px;padding:11px 15px;background:#111827;color:white;font-weight:800}.muted{color:#6b7280}.ok{color:#166534}.bad{color:#991b1b}.hidden{display:none}li{margin:8px 0}</style></head><body><main class="w"><h1>Add trial calendar events</h1><section class="card"><p>This will add five sample events for <b>28 July 2026</b>, with some made by Max and some made by Ola.</p><p class="muted">It keeps existing events. If these same trial events already exist, it replaces only those trial copies so you do not get duplicates.</p></section><section id="login" class="card"><h2>Sign in</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signIn">Sign in</button><p id="loginStatus" class="muted"></p></section><section id="panel" class="card hidden"><button id="add">Add 5 trial events</button><div id="status" class="muted" style="margin-top:10px">Ready.</div><ul id="list"></ul><p><a href="./calendar.html?v=trial1">Open calendar</a></p></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';import{getAuth,onAuthStateChanged,signInWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';const cfg={apiKey:'AIzaSyAhs2ANKnzeaGtlMA89FOuM5TiEpjTWTRQ',authDomain:'teo-checklist.firebaseapp.com',projectId:'teo-checklist',storageBucket:'teo-checklist.firebasestorage.app',messagingSenderId:'174394084827',appId:'1:174394084827:web:2ed6db19c135cb25362bfe'};const fb=initializeApp(cfg),auth=getAuth(fb),db=getFirestore(fb),ref=doc(db,'checklists','calendar');const $=id=>document.getElementById(id);const date='2026-07-28';const trials=[{id:'trial-2026-07-28-0900',title:'Midwife appointment',date,time:'09:00',madeBy:'Max',notes:'Trial event so you can see appointments in the calendar.'},{id:'trial-2026-07-28-1130',title:'Call nursery about availability',date,time:'11:30',madeBy:'Ola',notes:'Example planning call with a note attached.'},{id:'trial-2026-07-28-1400',title:'Compare car seat options',date,time:'14:00',madeBy:'Max',notes:'Check safety rating, ISOFIX base, and delivery time.'},{id:'trial-2026-07-28-1630',title:'Pick up nappies and wipes',date,time:'16:30',madeBy:'Ola',notes:'Example errand event.'},{id:'trial-2026-07-28-1900',title:'Hospital bag check-in',date,time:'19:00',madeBy:'Max',notes:'Quick evening review of what is still missing.'}];$('list').innerHTML=trials.map(e=>`<li><b>${e.time} ${e.title}</b><br><span class="muted">Made by ${e.madeBy}</span></li>`).join('');function dl(name,obj){const u=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('signIn').onclick=async()=>{try{$('loginStatus').textContent='Signing in...';await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){$('loginStatus').textContent=e.message}};$('add').onclick=async()=>{try{$('status').textContent='Loading current calendar...';const snap=await getDoc(ref),current=snap.exists()?snap.data():{events:[]},existing=Array.isArray(current.events)?current.events:[],stamp=new Date().toISOString().replace(/[:.]/g,'-');await setDoc(doc(db,'checklists','backup-before-trial-calendar-'+stamp),{kind:'backup-before-trial-calendar',source:'checklists/calendar',savedAt:serverTimestamp(),payload:current});dl('theo-calendar-before-trial-'+stamp+'.json',current);const trialIds=new Set(trials.map(e=>e.id));const events=[...existing.filter(e=>!trialIds.has(e.id)),...trials].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));await setDoc(ref,{events,updatedAt:serverTimestamp(),schemaVersion:'calendar-v2'},{merge:false});$('status').innerHTML='<span class="ok">Done. Five trial events were added and a backup was downloaded.</span>'}catch(e){$('status').innerHTML='<span class="bad">'+e.message+'</span>'}};onAuthStateChanged(auth,u=>{if(u){$('login').classList.add('hidden');$('panel').classList.remove('hidden')}else{$('login').classList.remove('hidden');$('panel').classList.add('hidden')}});</script></body></html>
