<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theo List rollback</title><style>body{margin:0;background:#f6f4ef;color:#272727;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:780px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e5dfd5;border-radius:17px;padding:16px;margin:12px 0;box-shadow:0 8px 25px #0000000d}h1{margin:0 0 8px}h2{font-size:17px;margin:0 0 6px}.muted{color:#747474}.good{color:#276447}.bad{color:#9b332d}button{border:0;border-radius:12px;padding:11px 14px;background:#2e6b55;color:#fff;font-weight:800;font-size:14px}.danger{background:#9b332d}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stats{font-weight:700}.raw{font-size:12px;background:#f7f5f0;border-radius:10px;padding:10px;max-height:220px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}.banner{background:#fff0ce;border-color:#ead28c}.success{background:#e4f1e7;border-color:#b8d4bf}</style></head><body><main class="wrap"><h1>Restore Theo List backup</h1><div class="card banner"><b>The live checklist is frozen.</b><div class="muted">Restoring here writes the exact backed-up Firebase document back to <code>checklists/teo</code>. No conversion is performed.</div></div><div id="status" class="card">Loading backups…</div><div id="list"></div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';import{getFirestore,collection,getDocs,doc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';const cfg={apiKey:'AIzaSyAhs2ANKnzeaGtlMA89FOuM5TiEpjTWTRQ',authDomain:'teo-checklist.firebaseapp.com',projectId:'teo-checklist',storageBucket:'teo-checklist.firebasestorage.app',messagingSenderId:'174394084827',appId:'1:174394084827:web:2ed6db19c135cb25362bfe'};const db=getFirestore(initializeApp(cfg)),status=document.getElementById('status'),list=document.getElementById('list');const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function inspect(v){let objects=0,checked=0,unchecked=0,names=[];const seen=new WeakSet();function walk(x){if(x==null)return;if(typeof x==='object'){if(seen.has(x))return;seen.add(x);if(!Array.isArray(x)){objects++;const n=x.name||x.title||x.text||x.label||x.item;if(n&&names.length<5)names.push(String(n));const keys=['done','checked','complete','completed','isDone','isChecked'];for(const k of keys)if(k in x){const val=x[k];if(val===true||val===1||val==='true'||val==='yes'||val==='done'||val==='checked')checked++;else if(val===false||val===0||val==='false'||val==='no'||val==='pending'||val==='unchecked')unchecked++;break}}for(const y of Object.values(x))walk(y)}}walk(v);return{objects,checked,unchecked,names}}async function restore(id,payload){const exact=payload&&payload.data&&typeof payload.data==='object'?payload.data:payload;if(!confirm(`Restore backup ${id} exactly? The current document will first be saved as an emergency backup.`))return;status.textContent='Creating emergency backup…';const target=doc(db,'checklists','teo'),current=await getDoc(target),stamp=new Date().toISOString().replace(/[:.]/g,'-');if(current.exists())await setDoc(doc(db,'checklist-backups',`emergency-before-rollback-${stamp}`),{source:'rollback-page',createdAt:serverTimestamp(),data:current.data()});status.textContent='Restoring exact backup…';await setDoc(target,exact);status.className='card success';status.innerHTML='<b>Backup restored exactly.</b><div>The live app remains frozen, so nothing can rewrite it. Tell ChatGPT which backup you restored and I will rebuild the reader without altering the data.</div>'}try{const snap=await getDocs(collection(db,'checklist-backups'));const docs=snap.docs.map(d=>({id:d.id,payload:d.data()})).sort((a,b)=>b.id.localeCompare(a.id));status.innerHTML=`<b class="good">${docs.length} backup(s) found.</b><div class="muted">Choose an older backup from before the GitHub migration. The preview shows detected checked values but restoration always uses the exact raw document.</div>`;if(!docs.length)list.innerHTML='<div class="card bad">No timestamped backups were found.</div>';for(const b of docs){const exact=b.payload?.data&&typeof b.payload.data==='object'?b.payload.data:b.payload,info=inspect(exact),card=document.createElement('section');card.className='card';card.innerHTML=`<div class="row"><div><h2>${esc(b.id)}</h2><div class="stats">Detected: ${info.checked} checked · ${info.unchecked} unchecked</div><div class="muted">${esc(info.names.join(' · ')||'No item-name preview detected')}</div></div><button>Restore exact backup</button></div><details><summary>Show raw backup</summary><pre class="raw">${esc(JSON.stringify(exact,null,2))}</pre></details>`;card.querySelector('button').onclick=()=>restore(b.id,b.payload);list.appendChild(card)}}catch(e){status.className='card bad';status.innerHTML=`<b>Could not load backups</b><pre class="raw">${esc(e.message)}</pre>`}</script></body></html>
