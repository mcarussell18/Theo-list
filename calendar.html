<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theo Calendar</title><style>:root{--bg:#f8fafc;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--soft:#f1f5f9;--blue:#2563eb;--bad:#b91c1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.w,main{max-width:860px;margin:auto}.w{padding:14px}main{padding:12px 12px 70px}header{position:sticky;top:0;z-index:5;background:#fffffff2;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}h1{font-size:1.3rem;margin:0}.top,.nav{display:flex;gap:8px;align-items:center}.top{justify-content:space-between}.nav,.actions{display:flex;gap:8px;overflow:auto;padding-top:9px}a{color:var(--blue);font-weight:750;text-decoration:none}button{font:inherit;border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:white;font-weight:750;white-space:nowrap}.primary{background:var(--ink);border-color:var(--ink);color:white}.danger{color:var(--bad)}.muted,#status{font-size:.84rem;color:var(--muted)}.login,.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px}.login{max-width:420px;margin:42px auto}.hidden{display:none!important}input,textarea{width:100%;border:1px solid #d1d5db;border-radius:12px;padding:10px;font:inherit;background:white}label{font-size:.82rem;font-weight:850;color:var(--muted);display:block;margin:9px 0 5px}.month{display:flex;justify-content:space-between;align-items:center;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;color:var(--muted);font-size:.75rem;font-weight:850}.day{min-height:82px;background:white;border:1px solid var(--line);border-radius:12px;padding:7px;overflow:hidden}.day.off{opacity:.45}.num{font-size:.8rem;color:var(--muted);font-weight:850}.pill{display:block;width:100%;text-align:left;margin-top:5px;border:0;border-radius:8px;background:#eef2ff;color:#3730a3;padding:5px 6px;font-size:.75rem;overflow:hidden;text-overflow:ellipsis}.maker{display:inline-block;border-radius:999px;background:#f1f5f9;color:#475569;font-size:.72rem;font-weight:850;padding:2px 7px;margin-top:4px}.list{display:grid;gap:8px;margin-top:12px}.event{background:white;border:1px solid var(--line);border-radius:14px;padding:12px}.event b{display:block}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:end;padding:12px;z-index:20}.modal.on{display:flex}.box{background:white;border-radius:22px 22px 14px 14px;width:100%;max-width:620px;margin:auto;padding:16px}@media(min-width:700px){.modal{align-items:center}.box{border-radius:22px}.day{min-height:105px}}</style></head><body><section id="login" class="login"><h1>Theo Calendar</h1><p>Sign in to view the shared calendar.</p><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button id="signIn" class="primary">Sign in</button><p id="loginStatus" class="muted"></p></section><div id="shell" class="hidden"><header><div class="w"><div class="top"><div><h1>Theo Calendar</h1><div id="status">Connecting...</div></div><button id="signOut">Sign out</button></div><div class="nav"><a href="./checklist.html">Checklist</a><a href="./notepad.html">Notepad</a><a href="./admin.html">Admin</a><a href="./seed-calendar-events.html">Add trial events</a><button id="add" class="primary">Add event</button></div></div></header><main><div class="month"><button id="prev">Prev</button><b id="monthLabel"></b><button id="next">Next</button></div><div class="grid" id="dow"></div><div class="grid" id="cal"></div><section class="card" style="margin-top:12px"><b>Upcoming</b><div id="upcoming" class="list"></div></section></main></div><div id="modal" class="modal"><div class="box"><h2>Event</h2><label>Title</label><input id="title"><label>Date</label><input id="date" type="date"><label>Time</label><input id="time" type="time"><label>Made by</label><input id="madeBy" placeholder="Max or Ola"><label>Notes</label><textarea id="notes"></textarea><div class="actions"><button id="save" class="primary">Save</button><button id="del" class="danger">Delete</button><button id="close">Cancel</button></div></div></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';import{getFirestore,doc,onSnapshot,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';const cfg={apiKey:'AIzaSyAhs2ANKnzeaGtlMA89FOuM5TiEpjTWTRQ',authDomain:'teo-checklist.firebaseapp.com',projectId:'teo-checklist',storageBucket:'teo-checklist.firebasestorage.app',messagingSenderId:'174394084827',appId:'1:174394084827:web:2ed6db19c135cb25362bfe'};const fb=initializeApp(cfg),auth=getAuth(fb),db=getFirestore(fb),ref=doc(db,'checklists','calendar');const $=id=>document.getElementById(id);let events=[],unsub=null,view=new Date(),editing=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);function iso(d){return d.toISOString().slice(0,10)}function clean(e){return{id:e.id||id(),title:e.title||'Untitled event',date:e.date||iso(new Date()),time:e.time||'',madeBy:e.madeBy||e.createdBy||'',notes:e.notes||''}}function saveAll(){return setDoc(ref,{events:events.map(clean),updatedAt:serverTimestamp(),schemaVersion:'calendar-v2'},{merge:false})}function render(){events=events.map(clean);const y=view.getFullYear(),m=view.getMonth(),names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];$('dow').innerHTML=names.map(x=>`<div class="dow">${x}</div>`).join('');$('monthLabel').textContent=view.toLocaleString(undefined,{month:'long',year:'numeric'});const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());let html='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const day=iso(d),off=d.getMonth()!==m,ev=events.filter(e=>e.date===day).sort((a,b)=>(a.time||'').localeCompare(b.time||''));html+=`<div class="day ${off?'off':''}" data-date="${day}"><div class="num">${d.getDate()}</div>${ev.slice(0,3).map(e=>`<button class="pill" data-id="${e.id}">${esc((e.time?e.time+' ':'')+e.title)}${e.madeBy?' · '+esc(e.madeBy):''}</button>`).join('')}${ev.length>3?`<div class="muted">+${ev.length-3} more</div>`:''}</div>`}$('cal').innerHTML=html;const today=iso(new Date());const upcoming=events.filter(e=>e.date>=today).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,12);$('upcoming').innerHTML=upcoming.length?upcoming.map(e=>`<div class="event" data-id="${e.id}"><b>${esc(e.title)}</b><div class="muted">${esc(e.date)} ${esc(e.time||'')}</div>${e.madeBy?`<span class="maker">Made by ${esc(e.madeBy)}</span>`:''}${e.notes?`<div style="margin-top:6px">${esc(e.notes)}</div>`:''}</div>`).join(''):'<p class="muted">No upcoming events yet.</p>'}function openEvent(e={id:null,title:'',date:iso(new Date()),time:'',madeBy:'',notes:''}){editing=e.id;$('title').value=e.title||'';$('date').value=e.date||iso(new Date());$('time').value=e.time||'';$('madeBy').value=e.madeBy||'';$('notes').value=e.notes||'';$('del').classList.toggle('hidden',!e.id);$('modal').classList.add('on')}document.addEventListener('click',ev=>{const pill=ev.target.closest('[data-id]');if(pill){const e=events.find(x=>x.id===pill.dataset.id);if(e)openEvent(e)}const day=ev.target.closest('.day');if(day&&!pill)openEvent({date:day.dataset.date})});$('add').onclick=()=>openEvent();$('close').onclick=()=>$('modal').classList.remove('on');$('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};$('next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};$('save').onclick=async()=>{const e=clean({id:editing||id(),title:$('title').value.trim()||'Untitled event',date:$('date').value,time:$('time').value,madeBy:$('madeBy').value.trim(),notes:$('notes').value.trim()});events=editing?events.map(x=>x.id===editing?e:x):[...events,e];$('modal').classList.remove('on');$('status').textContent='Saving...';await saveAll();$('status').textContent='Saved'};$('del').onclick=async()=>{if(!editing||!confirm('Delete this event?'))return;events=events.filter(e=>e.id!==editing);$('modal').classList.remove('on');await saveAll()};$('signIn').onclick=async()=>{try{$('loginStatus').textContent='Signing in...';await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){$('loginStatus').textContent=e.message}};$('signOut').onclick=()=>signOut(auth);onAuthStateChanged(auth,u=>{if(u){$('login').classList.add('hidden');$('shell').classList.remove('hidden');if(unsub)unsub();unsub=onSnapshot(ref,async s=>{if(!s.exists())await setDoc(ref,{events:[],createdAt:serverTimestamp(),schemaVersion:'calendar-v2'});else events=Array.isArray(s.data().events)?s.data().events.map(clean):[];render();$('status').textContent='Live sync connected'},e=>$('status').textContent=e.message)}else{if(unsub)unsub();$('login').classList.remove('hidden');$('shell').classList.add('hidden')}});</script></body></html>
