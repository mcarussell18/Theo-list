<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theo checklist recovery</title><style>body{font:15px/1.45 system-ui;margin:0;background:#f6f4ef;color:#272727}.wrap{max-width:760px;margin:auto;padding:20px}.card{background:white;border:1px solid #e5dfd5;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 8px 25px #0000000d}h1{margin:0 0 8px}h2{font-size:18px;margin:0 0 8px}.muted{color:#777}.ok{color:#276447}.bad{color:#9b332d}button{border:0;border-radius:11px;padding:10px 13px;background:#2e6b55;color:white;font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f5f0;padding:10px;border-radius:10px;max-height:260px;overflow:auto}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.count{font-weight:700}</style></head><body><div class="wrap"><h1>Theo checklist recovery</h1><p class="muted">This page only reads your Firebase data until you press Restore. A timestamped backup is created before anything is changed.</p><div id="status" class="card">Scanning Firebase…</div><div id="results"></div><p><a href="./">Back to checklist</a></p></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';import{getFirestore,collection,getDocs,doc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';const firebaseConfig={apiKey:'AIzaSyAhs2ANKnzeaGtlMA89FOuM5TiEpjTWTRQ',authDomain:'teo-checklist.firebaseapp.com',projectId:'teo-checklist',storageBucket:'teo-checklist.firebasestorage.app',messagingSenderId:'174394084827',appId:'1:174394084827:web:2ed6db19c135cb25362bfe',measurementId:'G-YBHZFPNFMQ'};const db=getFirestore(initializeApp(firebaseConfig));const out=document.querySelector('#results'),status=document.querySelector('#status');const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function asSections(raw){if(!raw||typeof raw!=='object')return[];let c=raw.sections||raw.data?.sections||raw.checklist||raw.groups||raw.categories||raw.list;if(Array.isArray(c)&&c.length&&c.every(x=>typeof x==='string'||x.name||x.title||x.items))return c.map((s,i)=>typeof s==='string'?{title:`Section ${i+1}`,items:[{name:s}]}:{title:s.title||s.name||s.heading||`Section ${i+1}`,items:(s.items||s.children||s.entries||[]).map(normalItem)});if(Array.isArray(raw.items))return[{title:'Checklist',items:raw.items.map(normalItem)}];return[]}function normalItem(x){if(typeof x==='string')return{name:x,done:false,note:'',price:'',url:'',priority:''};return{name:x.name||x.title||x.text||x.label||'Untitled item',done:!!(x.done||x.checked||x.complete||x.completed),note:x.note||x.notes||x.description||'',price:x.price||x.cost||'',url:x.url||x.link||x.productUrl||'',priority:x.priority||''}}function count(sections){return sections.reduce((n,s)=>n+(s.items?.length||0),0)}async function restore(id,raw,sections){if(!confirm(`Restore ${count(sections)} items from document “${id}” to the main checklist?`))return;const target=doc(db,'checklists','teo'),existing=await getDoc(target),stamp=new Date().toISOString().replace(/[:.]/g,'-');if(existing.exists())await setDoc(doc(db,'checklist-backups',`teo-${stamp}`),{source:'recovery-page',createdAt:serverTimestamp(),data:existing.data()});await setDoc(target,{sections});alert('Restored safely. Open the main checklist again.')}try{const snap=await getDocs(collection(db,'checklists'));status.innerHTML=`<b class="ok">Scan complete</b><br>${snap.size} checklist document(s) found.`;if(!snap.size)out.innerHTML='<div class="card bad">No documents were found in the checklists collection.</div>';snap.forEach(d=>{const raw=d.data(),sections=asSections(raw),items=count(sections),card=document.createElement('div');card.className='card';card.innerHTML=`<div class="row"><div><h2>${esc(d.id)}</h2><div class="count">${sections.length} sections · ${items} items</div></div>${items?'<button>Restore this data</button>':''}</div><details><summary>Show stored fields</summary><pre>${esc(JSON.stringify(raw,null,2))}</pre></details>`;const b=card.querySelector('button');if(b)b.onclick=()=>restore(d.id,raw,sections);out.appendChild(card)});}catch(e){status.innerHTML=`<b class="bad">Could not scan Firebase</b><pre>${esc(e.message)}</pre>`}</script></body></html>
