<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Theo Checklist</title>
<meta name="theme-color" content="#f6f4ef" />
<style>
:root{--bg:#f6f4ef;--card:#fff;--text:#272727;--muted:#777;--line:#e8e3da;--accent:#2e6b55;--danger:#a33;--shadow:0 8px 24px rgba(0,0,0,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{max-width:720px;margin:auto;padding:18px 14px 80px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.title{font-size:27px;font-weight:800;letter-spacing:-.6px}.status{font-size:12px;color:var(--muted)}button{font:inherit}.primary,.ghost,.danger{border:0;border-radius:12px;padding:10px 13px}.primary{background:var(--accent);color:#fff;font-weight:700}.ghost{background:#ece8df;color:#333}.danger{background:#f5e1df;color:var(--danger)}.section{margin:12px 0;background:var(--card);border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--shadow)}.section-head{display:flex;align-items:center;gap:10px;padding:14px}.section-title{font-weight:800;font-size:17px;flex:1}.chev{transition:.18s}.closed .chev{transform:rotate(-90deg)}.section-body{border-top:1px solid var(--line)}.closed .section-body{display:none}.item{padding:12px 13px;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;cursor:pointer}.check{width:22px;height:22px;margin-top:1px;accent-color:var(--accent)}.name{font-weight:700;overflow-wrap:anywhere}.done .name{text-decoration:line-through;color:#8c8c8c}.preview{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.chip{font-size:11px;border-radius:999px;padding:3px 7px;background:#eee9df}.must{background:#f8d9d6;color:#872d26}.nice{background:#f6eac4;color:#705d14}.bought{background:#dcecdf;color:#285d37}.price{background:#dfeae6;color:#215744;font-weight:700}.details{display:none;padding:10px 0 2px 32px}.expanded .details{display:block}.note{white-space:pre-wrap;color:#444}.link{display:inline-block;margin-top:10px;color:var(--accent);font-weight:700;text-decoration:none}.hint{font-size:12px;color:var(--muted);margin:4px 2px 14px}.empty{padding:17px;color:var(--muted)}dialog{width:min(92vw,470px);border:0;border-radius:18px;padding:0;box-shadow:0 24px 80px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(0,0,0,.35)}.modal{padding:18px}.modal h2{margin:0 0 14px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700;color:#666;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid #d9d3c9;border-radius:11px;background:#fff;font:inherit}.field textarea{min-height:90px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.section-actions{display:flex;gap:6px}.icon-btn{border:0;background:transparent;font-size:18px;padding:3px 6px}.fab{position:fixed;right:18px;bottom:18px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-size:26px;width:54px;height:54px;box-shadow:0 12px 30px rgba(0,0,0,.2)}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><div class="title">Theo checklist</div><div class="status" id="status">Connecting…</div></div><button class="ghost" id="addSection">+ Section</button></div>
  <div class="hint">Tap an item to expand. Hold an item to edit. Tick the box to complete it.</div>
  <main id="app"></main>
</div>
<button class="fab" id="addItem" aria-label="Add item">+</button>
<dialog id="itemDialog"><form method="dialog" class="modal" id="itemForm"><h2 id="itemDialogTitle">Add item</h2><input type="hidden" id="editSection"><input type="hidden" id="editItem"><div class="field"><label>Section</label><select id="itemSection"></select></div><div class="field"><label>Item name</label><input id="itemName" required maxlength="120"></div><div class="field"><label>Note</label><textarea id="itemNote" placeholder="Add details, sizes, ideas or reminders"></textarea></div><div class="field"><label>Price</label><input id="itemPrice" inputmode="decimal" placeholder="e.g. £49.99"></div><div class="field"><label>Product or reference link</label><input id="itemUrl" type="url" placeholder="https://..."></div><div class="field"><label>Priority</label><select id="itemPriority"><option value="">None</option><option value="must">Must buy</option><option value="nice">Nice to have</option><option value="bought">Already bought</option></select></div><div class="actions"><button type="button" class="danger" id="deleteItem" hidden>Delete</button><button type="button" class="ghost" data-close="itemDialog">Cancel</button><button class="primary" value="save">Save</button></div></form></dialog>
<dialog id="sectionDialog"><form method="dialog" class="modal" id="sectionForm"><h2 id="sectionDialogTitle">Add section</h2><input type="hidden" id="sectionIndex"><div class="field"><label>Section name</label><input id="sectionName" required maxlength="80"></div><div class="actions"><button type="button" class="danger" id="deleteSection" hidden>Delete</button><button type="button" class="ghost" data-close="sectionDialog">Cancel</button><button class="primary" value="save">Save</button></div></form></dialog>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import {getFirestore,doc,onSnapshot,setDoc} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyAhs2ANKnzeaGtlMA89FOuM5TiEpjTWTRQ',authDomain:'teo-checklist.firebaseapp.com',projectId:'teo-checklist',storageBucket:'teo-checklist.firebasestorage.app',messagingSenderId:'174394084827',appId:'1:174394084827:web:2ed6db19c135cb25362bfe',measurementId:'G-YBHZFPNFMQ'};
const db=getFirestore(initializeApp(firebaseConfig)); const ref=doc(db,'checklists','teo');
const defaults={sections:[{title:'Sleeping',items:[{name:'Cot or bedside crib',done:false,note:'',price:'',url:'',priority:'must'},{name:'Mattress',done:false,note:'Firm, flat and correctly sized.',price:'',url:'',priority:'must'}]},{title:'Travel',items:[{name:'Car seat',done:false,note:'Check newborn insert and ISOFIX compatibility.',price:'',url:'',priority:'must'},{name:'Pram',done:false,note:'',price:'',url:'',priority:'nice'}]}]};
let data=defaults;let saving=false;const appEl=document.querySelector('#app'),statusEl=document.querySelector('#status');
const expanded=new Set(JSON.parse(localStorage.getItem('theo-expanded')||'[]'));const closed=new Set(JSON.parse(localStorage.getItem('theo-closed')||'[]'));
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function persistUI(){localStorage.setItem('theo-expanded',JSON.stringify([...expanded]));localStorage.setItem('theo-closed',JSON.stringify([...closed]))}
function render(){appEl.innerHTML='';(data.sections||[]).forEach((s,si)=>{const sec=document.createElement('section');sec.className='section'+(closed.has(si)?' closed':'');sec.innerHTML=`<div class="section-head"><span class="chev">⌄</span><div class="section-title">${esc(s.title)}</div><div class="section-actions"><button class="icon-btn add-in" title="Add item">＋</button><button class="icon-btn edit-sec" title="Edit section">⋯</button></div></div><div class="section-body"></div>`;sec.querySelector('.section-head').addEventListener('click',e=>{if(e.target.closest('button'))return;closed.has(si)?closed.delete(si):closed.add(si);persistUI();render()});sec.querySelector('.add-in').onclick=()=>openItem(si);sec.querySelector('.edit-sec').onclick=()=>openSection(si);const body=sec.querySelector('.section-body');(s.items||[]).forEach((it,ii)=>{const key=`${si}:${ii}`,el=document.createElement('div');el.className='item'+(it.done?' done':'')+(expanded.has(key)?' expanded':'');const noteLine=(it.note||'').split(/\r?\n/)[0];const linkIcon=it.url?'🛍️ ':'';el.innerHTML=`<div class="row"><input class="check" type="checkbox" ${it.done?'checked':''}><div><div class="name">${esc(it.name)}</div>${noteLine?`<div class="preview">${esc(noteLine)}</div>`:''}<div class="chips">${it.price?`<span class="chip price">${esc(it.price)}</span>`:''}${it.priority?`<span class="chip ${it.priority}">${it.priority==='must'?'Must buy':it.priority==='nice'?'Nice to have':'Bought'}</span>`:''}${it.url?`<span class="chip">${linkIcon}Link</span>`:''}</div></div><span>⌄</span></div><div class="details">${it.note?`<div class="note">${esc(it.note)}</div>`:''}${it.url?`<a class="link" href="${esc(it.url)}" target="_blank" rel="noopener">🛍️ Open product</a>`:''}</div>`;
let timer;const row=el.querySelector('.row');row.addEventListener('pointerdown',()=>timer=setTimeout(()=>openItem(si,ii),650));['pointerup','pointercancel','pointerleave'].forEach(ev=>row.addEventListener(ev,()=>clearTimeout(timer)));row.addEventListener('click',e=>{if(e.target.classList.contains('check'))return;expanded.has(key)?expanded.delete(key):expanded.add(key);persistUI();render()});el.querySelector('.check').addEventListener('click',async e=>{e.stopPropagation();it.done=e.target.checked;await save()});body.appendChild(el)});if(!(s.items||[]).length)body.innerHTML='<div class="empty">No items yet</div>';appEl.appendChild(sec)});fillSections()}
async function save(){saving=true;statusEl.textContent='Saving…';await setDoc(ref,data);saving=false;statusEl.textContent='Saved'}
onSnapshot(ref,s=>{if(s.exists())data=s.data();else setDoc(ref,defaults);if(!saving){statusEl.textContent='Synced';render()}},err=>{statusEl.textContent='Sync error';console.error(err)});
function fillSections(){const sel=document.querySelector('#itemSection');sel.innerHTML=(data.sections||[]).map((s,i)=>`<option value="${i}">${esc(s.title)}</option>`).join('')}
const itemDialog=document.querySelector('#itemDialog');function openItem(si=0,ii=null){fillSections();document.querySelector('#editSection').value=si;document.querySelector('#editItem').value=ii??'';document.querySelector('#itemSection').value=si;const it=ii===null?{name:'',note:'',price:'',url:'',priority:''}:data.sections[si].items[ii];document.querySelector('#itemDialogTitle').textContent=ii===null?'Add item':'Edit item';document.querySelector('#itemName').value=it.name||'';document.querySelector('#itemNote').value=it.note||'';document.querySelector('#itemPrice').value=it.price||'';document.querySelector('#itemUrl').value=it.url||'';document.querySelector('#itemPriority').value=it.priority||'';document.querySelector('#deleteItem').hidden=ii===null;itemDialog.showModal()}
document.querySelector('#itemForm').addEventListener('submit',async e=>{e.preventDefault();const oldSi=+document.querySelector('#editSection').value,raw=document.querySelector('#editItem').value,ii=raw===''?null:+raw,newSi=+document.querySelector('#itemSection').value;const item={name:document.querySelector('#itemName').value.trim(),note:document.querySelector('#itemNote').value.trim(),price:document.querySelector('#itemPrice').value.trim(),url:document.querySelector('#itemUrl').value.trim(),priority:document.querySelector('#itemPriority').value,done:ii===null?false:data.sections[oldSi].items[ii].done};if(!item.name)return;if(ii!==null)data.sections[oldSi].items.splice(ii,1);data.sections[newSi].items.push(item);itemDialog.close();await save()});document.querySelector('#deleteItem').onclick=async()=>{const si=+document.querySelector('#editSection').value,ii=+document.querySelector('#editItem').value;if(confirm('Delete this item?')){data.sections[si].items.splice(ii,1);itemDialog.close();await save()}};
const sectionDialog=document.querySelector('#sectionDialog');function openSection(si=null){document.querySelector('#sectionIndex').value=si??'';document.querySelector('#sectionDialogTitle').textContent=si===null?'Add section':'Edit section';document.querySelector('#sectionName').value=si===null?'':data.sections[si].title;document.querySelector('#deleteSection').hidden=si===null;sectionDialog.showModal()}
document.querySelector('#sectionForm').addEventListener('submit',async e=>{e.preventDefault();const raw=document.querySelector('#sectionIndex').value,name=document.querySelector('#sectionName').value.trim();if(!name)return;if(raw==='')data.sections.push({title:name,items:[]});else data.sections[+raw].title=name;sectionDialog.close();await save()});document.querySelector('#deleteSection').onclick=async()=>{const si=+document.querySelector('#sectionIndex').value;if(confirm('Delete this section and all its items?')){data.sections.splice(si,1);sectionDialog.close();await save()}};
document.querySelector('#addSection').onclick=()=>openSection();document.querySelector('#addItem').onclick=()=>openItem(0);document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.querySelector('#'+b.dataset.close).close());
</script>
</body>
</html>
