<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Theo Checklist</title><style>
:root{--bg:#f6f4ef;--card:#fff;--text:#272727;--muted:#777;--line:#e8e3da;--accent:#2e6b55;--danger:#a33}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{max-width:720px;margin:auto;padding:18px 14px 80px}.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:27px;font-weight:800}.status{font-size:12px;color:var(--muted)}button{font:inherit;border:0;border-radius:11px;padding:9px 12px}.primary{background:var(--accent);color:#fff;font-weight:700}.ghost{background:#ece8df}.section{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:12px 0;overflow:hidden;box-shadow:0 8px 24px #0000000d}.section-head{display:flex;gap:10px;align-items:center;padding:14px}.section-title{font-size:17px;font-weight:800;flex:1}.section-body{border-top:1px solid var(--line)}.closed .section-body{display:none}.item{padding:12px 13px;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}.check{width:22px;height:22px;accent-color:var(--accent)}.name{font-weight:700}.done .name{text-decoration:line-through;color:#999}.preview{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.chip{font-size:11px;padding:3px 7px;border-radius:999px;background:#eee9df}.must{background:#f8d9d6}.nice{background:#f6eac4}.bought{background:#dcecdf}.price{background:#dfeae6;font-weight:700}.details{display:none;padding:10px 0 2px 32px}.expanded .details{display:block}.note{white-space:pre-wrap}.link{display:inline-block;margin-top:10px;color:var(--accent);font-weight:700}.hint{font-size:12px;color:var(--muted);margin:5px 2px 12px}.empty{padding:16px;color:var(--muted)}dialog{width:min(92vw,470px);border:0;border-radius:18px;padding:0}.modal{padding:18px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700;color:#666;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #d8d2c8;border-radius:10px;font:inherit}.field textarea{min-height:90px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.danger{background:#f5e1df;color:var(--danger)}.icon{background:transparent;padding:4px;font-size:18px}.fab{position:fixed;right:18px;bottom:18px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;font-size:26px}
</style></head><body>
<div class="app"><div class="top"><div><div class="title">Theo checklist</div><div class="status" id="status">Connecting…</div></div><button class="ghost" id="addSection">+ Section</button></div><div class="hint">Tap to expand. Hold to edit. Tick to complete.</div><main id="app"></main></div><button class="fab" id="addItem">+</button>
<dialog id="itemDialog"><form method="dialog" class="modal" id="itemForm"><h2 id="itemHeading">Add item</h2><input type="hidden" id="oldSection"><input type="hidden" id="oldItem"><div class="field"><label>Section</label><select id="itemSection"></select></div><div class="field"><label>Item name</label><input id="itemName" required></div><div class="field"><label>Note</label><textarea id="itemNote"></textarea></div><div class="field"><label>Price</label><input id="itemPrice" placeholder="e.g. £49.99"></div><div class="field"><label>Product link</label><input id="itemUrl" type="url" placeholder="https://..."></div><div class="field"><label>Priority</label><select id="itemPriority"><option value="">None</option><option value="must">Must buy</option><option value="nice">Nice to have</option><option value="bought">Already bought</option></select></div><div class="actions"><button type="button" class="danger" id="deleteItem" hidden>Delete</button><button type="button" class="ghost" onclick="itemDialog.close()">Cancel</button><button class="primary">Save</button></div></form></dialog>
<dialog id="sectionDialog"><form method="dialog" class="modal" id="sectionForm"><h2 id="sectionHeading">Add section</h2><input type="hidden" id="sectionIndex"><div class="field"><label>Section name</label><input id="sectionName" required></div><div class="actions"><button type="button" class="danger" id="deleteSection" hidden>Delete</button><button type="button" class="ghost" onclick="sectionDialog.close()">Cancel</button><button class="primary">Save</button></div></form></dialog>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';import{getFirestore,doc,onSnapshot,setDoc}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
const cfg={apiKey:'AIzaSyAhs2ANKnzeaGtlMA89FOuM5TiEpjTWTRQ',authDomain:'teo-checklist.firebaseapp.com',projectId:'teo-checklist',storageBucket:'teo-checklist.firebasestorage.app',messagingSenderId:'174394084827',appId:'1:174394084827:web:2ed6db19c135cb25362bfe'};const db=getFirestore(initializeApp(cfg)),ref=doc(db,'checklists','teo');let data={sections:[]},saving=false;const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const expanded=new Set(JSON.parse(localStorage.getItem('theo-expanded')||'[]')),closed=new Set(JSON.parse(localStorage.getItem('theo-closed')||'[]'));
function vals(v){if(Array.isArray(v))return v;if(v&&typeof v==='object')return Object.entries(v).sort((a,b)=>(a[1]?.order??0)-(b[1]?.order??0)).map(([id,x])=>x&&typeof x==='object'?{_id:id,...x}:x);return[]}
function normalItem(x){if(typeof x==='string')return{name:x,done:false,note:'',price:'',url:'',priority:''};x=x||{};return{name:x.name||x.title||x.text||x.label||x.item||x.value||x.task||'Untitled item',done:!!(x.done||x.checked||x.complete||x.completed||x.isDone),note:x.note||x.notes||x.description||x.details||x.comment||'',price:x.price||x.cost||x.amount||'',url:x.url||x.link||x.productUrl||x.href||'',priority:x.priority||''}}
function makeSection(s,i,key){if(typeof s==='string')return{title:key||`Section ${i+1}`,items:[normalItem(s)]};s=s||{};const source=s.items??s.children??s.entries??s.list??s.tasks??s.products??s.values??[];return{title:s.title||s.name||s.heading||s.label||key||`Section ${i+1}`,items:vals(source).map(normalItem)}}
function convert(raw){if(!raw||typeof raw!=='object')return[];const direct=raw.sections??raw.data?.sections??raw.checklist??raw.groups??raw.categories??raw.list;if(direct){if(Array.isArray(direct))return direct.map((s,i)=>makeSection(s,i));if(typeof direct==='object')return Object.entries(direct).map(([k,s],i)=>makeSection(s,i,k)).filter(s=>s.items.length||s.title)}if(raw.items){return[{title:'Checklist',items:vals(raw.items).map(normalItem)}]}const out=[];for(const[k,v]of Object.entries(raw)){if(['updatedAt','createdAt','version','metadata','expanded','closed'].includes(k))continue;if(Array.isArray(v))out.push({title:k,items:v.map(normalItem)});else if(v&&typeof v==='object'){const nested=v.items??v.children??v.entries??v.list??v.tasks??v.products;if(nested)out.push(makeSection(v,out.length,k));else{const ov=vals(v);if(ov.length&&ov.some(x=>typeof x==='string'||x?.name||x?.title||x?.text||x?.label))out.push({title:k,items:ov.map(normalItem)})}}}if(out.length)return out;const nested=[];function walk(v,label='Checklist',depth=0){if(depth>8||v==null)return;if(Array.isArray(v)){if(v.length)nested.push({title:label,items:v.map(normalItem)});return}if(typeof v==='object'){const arr=vals(v);if(arr.length&&arr.some(x=>typeof x==='string'||x?.name||x?.title||x?.text||x?.label||x?.task)){nested.push({title:label,items:arr.map(normalItem)});return}for(const[k,x]of Object.entries(v))walk(x,k,depth+1)}}walk(raw);return nested}
function storeUI(){localStorage.setItem('theo-expanded',JSON.stringify([...expanded]));localStorage.setItem('theo-closed',JSON.stringify([...closed]))}function fillSections(){itemSection.innerHTML=data.sections.map((s,i)=>`<option value="${i}">${esc(s.title)}</option>`).join('')}
function render(){app.innerHTML='';data.sections.forEach((s,si)=>{const sec=document.createElement('section');sec.className='section'+(closed.has(si)?' closed':'');sec.innerHTML=`<div class="section-head"><span>⌄</span><div class="section-title">${esc(s.title)}</div><button class="icon add">＋</button><button class="icon edit">⋯</button></div><div class="section-body"></div>`;sec.querySelector('.section-head').onclick=e=>{if(e.target.closest('button'))return;closed.has(si)?closed.delete(si):closed.add(si);storeUI();render()};sec.querySelector('.add').onclick=()=>openItem(si);sec.querySelector('.edit').onclick=()=>openSection(si);const body=sec.querySelector('.section-body');s.items.forEach((it,ii)=>{const key=`${si}:${ii}`,el=document.createElement('div');el.className='item'+(it.done?' done':'')+(expanded.has(key)?' expanded':'');const first=(it.note||'').split(/\r?\n/)[0];el.innerHTML=`<div class="row"><input class="check" type="checkbox" ${it.done?'checked':''}><div><div class="name">${esc(it.name)}</div>${first?`<div class="preview">${esc(first)}</div>`:''}<div class="chips">${it.price?`<span class="chip price">${esc(it.price)}</span>`:''}${it.priority?`<span class="chip ${it.priority}">${it.priority==='must'?'Must buy':it.priority==='nice'?'Nice to have':'Bought'}</span>`:''}${it.url?'<span class="chip">🛍️ Link</span>':''}</div></div><span>⌄</span></div><div class="details">${it.note?`<div class="note">${esc(it.note)}</div>`:''}${it.url?`<a class="link" href="${esc(it.url)}" target="_blank">🛍️ Open product</a>`:''}</div>`;let t;const row=el.querySelector('.row');row.onpointerdown=()=>t=setTimeout(()=>openItem(si,ii),650);row.onpointerup=row.onpointercancel=row.onpointerleave=()=>clearTimeout(t);row.onclick=e=>{if(e.target.classList.contains('check'))return;expanded.has(key)?expanded.delete(key):expanded.add(key);storeUI();render()};el.querySelector('.check').onclick=async e=>{e.stopPropagation();it.done=e.target.checked;await save()};body.appendChild(el)});if(!s.items.length)body.innerHTML='<div class="empty">No items yet</div>';app.appendChild(sec)});if(!data.sections.length)app.innerHTML='<div class="empty">The Firebase document exists, but no checklist entries could be recognised.</div>';fillSections()}
async function save(){saving=true;status.textContent='Saving…';await setDoc(ref,data);saving=false;status.textContent='Saved'}onSnapshot(ref,async snap=>{if(!snap.exists()){status.textContent='No data found';render();return}const raw=snap.data(),sections=convert(raw);data={sections};const count=sections.reduce((n,s)=>n+s.items.length,0);status.textContent=`Synced · ${count} items`;render();if(count&&(!Array.isArray(raw.sections)||raw.sections.some?.(x=>!Array.isArray(x.items))))await setDoc(ref,data)},e=>{status.textContent='Sync error';console.error(e)});
function openItem(si=0,ii=null){if(!data.sections.length)return;fillSections();oldSection.value=si;oldItem.value=ii??'';itemSection.value=si;const it=ii===null?{name:'',note:'',price:'',url:'',priority:''}:data.sections[si].items[ii];itemHeading.textContent=ii===null?'Add item':'Edit item';itemName.value=it.name||'';itemNote.value=it.note||'';itemPrice.value=it.price||'';itemUrl.value=it.url||'';itemPriority.value=it.priority||'';deleteItem.hidden=ii===null;itemDialog.showModal()}itemForm.onsubmit=async e=>{e.preventDefault();const osi=+oldSection.value,raw=oldItem.value,ii=raw===''?null:+raw,nsi=+itemSection.value,it={name:itemName.value.trim(),note:itemNote.value.trim(),price:itemPrice.value.trim(),url:itemUrl.value.trim(),priority:itemPriority.value,done:ii===null?false:data.sections[osi].items[ii].done};if(ii!==null)data.sections[osi].items.splice(ii,1);data.sections[nsi].items.push(it);itemDialog.close();await save()};deleteItem.onclick=async()=>{const si=+oldSection.value,ii=+oldItem.value;if(confirm('Delete this item?')){data.sections[si].items.splice(ii,1);itemDialog.close();await save()}};function openSection(si=null){sectionIndex.value=si??'';sectionHeading.textContent=si===null?'Add section':'Edit section';sectionName.value=si===null?'':data.sections[si].title;deleteSection.hidden=si===null;sectionDialog.showModal()}sectionForm.onsubmit=async e=>{e.preventDefault();const i=sectionIndex.value,name=sectionName.value.trim();if(i==='')data.sections.push({title:name,items:[]});else data.sections[+i].title=name;sectionDialog.close();await save()};deleteSection.onclick=async()=>{const i=+sectionIndex.value;if(confirm('Delete this section and all its items?')){data.sections.splice(i,1);sectionDialog.close();await save()}};addSection.onclick=()=>openSection();addItem.onclick=()=>openItem(0);
</script></body></html>
