<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Theo Checklist</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--text:#272727;--muted:#777;--line:#e8e3da;--accent:#2e6b55;--danger:#a33}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{max-width:720px;margin:auto;padding:18px 14px 80px}.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:27px;font-weight:800}.status{font-size:12px;color:var(--muted)}button{font:inherit;border:0;border-radius:11px;padding:9px 12px}.primary{background:var(--accent);color:white;font-weight:700}.ghost{background:#ece8df}.section{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:12px 0;overflow:hidden;box-shadow:0 8px 24px #0000000d}.section-head{display:flex;gap:10px;align-items:center;padding:14px}.section-title{font-size:17px;font-weight:800;flex:1}.section-body{border-top:1px solid var(--line)}.closed .section-body{display:none}.item{padding:12px 13px;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}.check{width:22px;height:22px;accent-color:var(--accent)}.name{font-weight:700}.done .name{text-decoration:line-through;color:#999}.preview{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.chip{font-size:11px;padding:3px 7px;border-radius:999px;background:#eee9df}.must{background:#f8d9d6}.nice{background:#f6eac4}.bought{background:#dcecdf}.price{background:#dfeae6;font-weight:700}.details{display:none;padding:10px 0 2px 32px}.expanded .details{display:block}.note{white-space:pre-wrap}.link{display:inline-block;margin-top:10px;color:var(--accent);font-weight:700}.hint{font-size:12px;color:var(--muted);margin:5px 2px 12px}.empty,.error{padding:16px;color:var(--muted)}.error{color:#9b332d;background:#f8e2df;border-radius:12px}dialog{width:min(92vw,470px);border:0;border-radius:18px;padding:0}.modal{padding:18px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700;color:#666;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #d8d2c8;border-radius:10px;font:inherit}.field textarea{min-height:90px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.danger{background:#f5e1df;color:var(--danger)}.icon{background:transparent;padding:4px;font-size:18px}.fab{position:fixed;right:18px;bottom:18px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:white;font-size:26px}
</style>
</head>
<body>
<div class="app"><div class="top"><div><div class="title">Theo checklist</div><div class="status" id="status">Connecting…</div></div><button class="ghost" id="addSection">+ Section</button></div><div class="hint">Tap to expand. Hold to edit. Tick to complete.</div><main id="app"></main></div><button class="fab" id="addItem">+</button>
<dialog id="itemDialog"><form class="modal" id="itemForm"><h2 id="itemHeading">Add item</h2><input type="hidden" id="oldSection"><input type="hidden" id="oldItem"><div class="field"><label>Section</label><select id="itemSection"></select></div><div class="field"><label>Item name</label><input id="itemName" required></div><div class="field"><label>Note</label><textarea id="itemNote"></textarea></div><div class="field"><label>Price</label><input id="itemPrice" placeholder="e.g. £49.99"></div><div class="field"><label>Product link</label><input id="itemUrl" type="url" placeholder="https://..."></div><div class="field"><label>Priority</label><select id="itemPriority"><option value="">None</option><option value="must">Must buy</option><option value="nice">Nice to have</option><option value="bought">Already bought</option></select></div><div class="actions"><button type="button" class="danger" id="deleteItem" hidden>Delete</button><button type="button" class="ghost" id="cancelItem">Cancel</button><button class="primary" type="submit">Save</button></div></form></dialog>
<dialog id="sectionDialog"><form class="modal" id="sectionForm"><h2 id="sectionHeading">Add section</h2><input type="hidden" id="sectionIndex"><div class="field"><label>Section name</label><input id="sectionName" required></div><div class="actions"><button type="button" class="danger" id="deleteSection" hidden>Delete</button><button type="button" class="ghost" id="cancelSection">Cancel</button><button class="primary" type="submit">Save</button></div></form></dialog>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import{getFirestore,doc,onSnapshot,setDoc}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
const cfg={apiKey:'AIzaSyAhs2ANKnzeaGtlMA89FOuM5TiEpjTWTRQ',authDomain:'teo-checklist.firebaseapp.com',projectId:'teo-checklist',storageBucket:'teo-checklist.firebasestorage.app',messagingSenderId:'174394084827',appId:'1:174394084827:web:2ed6db19c135cb25362bfe'};
const els={app:document.getElementById('app'),status:document.getElementById('status'),addSection:document.getElementById('addSection'),addItem:document.getElementById('addItem'),itemDialog:document.getElementById('itemDialog'),itemForm:document.getElementById('itemForm'),itemHeading:document.getElementById('itemHeading'),oldSection:document.getElementById('oldSection'),oldItem:document.getElementById('oldItem'),itemSection:document.getElementById('itemSection'),itemName:document.getElementById('itemName'),itemNote:document.getElementById('itemNote'),itemPrice:document.getElementById('itemPrice'),itemUrl:document.getElementById('itemUrl'),itemPriority:document.getElementById('itemPriority'),deleteItem:document.getElementById('deleteItem'),cancelItem:document.getElementById('cancelItem'),sectionDialog:document.getElementById('sectionDialog'),sectionForm:document.getElementById('sectionForm'),sectionHeading:document.getElementById('sectionHeading'),sectionIndex:document.getElementById('sectionIndex'),sectionName:document.getElementById('sectionName'),deleteSection:document.getElementById('deleteSection'),cancelSection:document.getElementById('cancelSection')};
let db,ref,data={sections:[]},saving=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const expanded=new Set(JSON.parse(localStorage.getItem('theo-expanded')||'[]')),closed=new Set(JSON.parse(localStorage.getItem('theo-closed')||'[]'));
function arr(v){return Array.isArray(v)?v:(v&&typeof v==='object'?Object.values(v):[])}
function normalItem(x){if(typeof x==='string')return{name:x,done:false,note:'',price:'',url:'',priority:''};x=x||{};return{name:x.name||x.title||x.text||x.label||x.item||x.value||'Untitled item',done:!!(x.done||x.checked||x.complete||x.completed||x.isDone),note:x.note||x.notes||x.description||x.details||x.comment||'',price:x.price||x.cost||x.amount||'',url:x.url||x.link||x.productUrl||x.href||'',priority:x.priority||''}}
function normalSection(s,i){if(typeof s==='string')return{title:`Section ${i+1}`,items:[normalItem(s)]};s=s||{};return{title:s.title||s.name||s.heading||s.label||`Section ${i+1}`,items:arr(s.items||s.children||s.entries||s.list||s.tasks).map(normalItem)}}
function convert(raw){if(!raw||typeof raw!=='object')return[];const direct=raw.sections||raw.data?.sections||raw.checklist||raw.groups||raw.categories||raw.list;if(direct){const list=arr(direct);if(list.length&&list.every(x=>typeof x==='string'||(x&&typeof x==='object'&&!('items'in x)&&!('children'in x)&&!('entries'in x))))return[{title:'Checklist',items:list.map(normalItem)}];return list.map(normalSection)}if(raw.items)return[{title:'Checklist',items:arr(raw.items).map(normalItem)}];const out=[];for(const[k,v]of Object.entries(raw)){if(['updatedAt','createdAt','version','metadata'].includes(k))continue;if(Array.isArray(v)||(v&&typeof v==='object')){const list=arr(v);if(list.length){const first=list[0];if(first&&typeof first==='object'&&('items'in first||'children'in first||'entries'in first))out.push(...list.map(normalSection));else out.push({title:k,items:list.map(normalItem)})}}}return out.filter(s=>s.items.length)}
function saveUI(){localStorage.setItem('theo-expanded',JSON.stringify([...expanded]));localStorage.setItem('theo-closed',JSON.stringify([...closed]))}
function fillSections(){els.itemSection.innerHTML=data.sections.map((s,i)=>`<option value="${i}">${esc(s.title)}</option>`).join('')}
function render(){els.app.innerHTML='';for(const[sI,s]of data.sections.entries()){const sec=document.createElement('section');sec.className='section'+(closed.has(sI)?' closed':'');sec.innerHTML=`<div class="section-head"><span>⌄</span><div class="section-title">${esc(s.title)}</div><button class="icon add">＋</button><button class="icon edit">⋯</button></div><div class="section-body"></div>`;sec.querySelector('.section-head').addEventListener('click',e=>{if(e.target.closest('button'))return;closed.has(sI)?closed.delete(sI):closed.add(sI);saveUI();render()});sec.querySelector('.add').onclick=()=>openItem(sI);sec.querySelector('.edit').onclick=()=>openSection(sI);const body=sec.querySelector('.section-body');for(const[iI,it]of s.items.entries()){const key=`${sI}:${iI}`,el=document.createElement('div');el.className='item'+(it.done?' done':'')+(expanded.has(key)?' expanded':'');const first=(it.note||'').split(/\r?\n/)[0];el.innerHTML=`<div class="row"><input class="check" type="checkbox" ${it.done?'checked':''}><div><div class="name">${esc(it.name)}</div>${first?`<div class="preview">${esc(first)}</div>`:''}<div class="chips">${it.price?`<span class="chip price">${esc(it.price)}</span>`:''}${it.priority?`<span class="chip ${esc(it.priority)}">${it.priority==='must'?'Must buy':it.priority==='nice'?'Nice to have':'Bought'}</span>`:''}${it.url?'<span class="chip">🛍️ Link</span>':''}</div></div><span>⌄</span></div><div class="details">${it.note?`<div class="note">${esc(it.note)}</div>`:''}${it.url?`<a class="link" href="${esc(it.url)}" target="_blank" rel="noopener">🛍️ Open product</a>`:''}</div>`;let timer;const row=el.querySelector('.row');row.onpointerdown=()=>timer=setTimeout(()=>openItem(sI,iI),650);row.onpointerup=row.onpointercancel=row.onpointerleave=()=>clearTimeout(timer);row.onclick=e=>{if(e.target.classList.contains('check'))return;expanded.has(key)?expanded.delete(key):expanded.add(key);saveUI();render()};el.querySelector('.check').onclick=async e=>{e.stopPropagation();it.done=e.target.checked;await save()};body.appendChild(el)}if(!s.items.length)body.innerHTML='<div class="empty">No items yet</div>';els.app.appendChild(sec)}if(!data.sections.length)els.app.innerHTML='<div class="empty">No checklist items found.</div>';fillSections()}
async function save(){saving=true;els.status.textContent='Saving…';await setDoc(ref,data);saving=false;els.status.textContent='Saved'}
function openItem(si=0,ii=null){fillSections();els.oldSection.value=si;els.oldItem.value=ii??'';els.itemSection.value=si;const it=ii===null?{name:'',note:'',price:'',url:'',priority:''}:data.sections[si].items[ii];els.itemHeading.textContent=ii===null?'Add item':'Edit item';els.itemName.value=it.name||'';els.itemNote.value=it.note||'';els.itemPrice.value=it.price||'';els.itemUrl.value=it.url||'';els.itemPriority.value=it.priority||'';els.deleteItem.hidden=ii===null;els.itemDialog.showModal()}
function openSection(si=null){els.sectionIndex.value=si??'';els.sectionHeading.textContent=si===null?'Add section':'Edit section';els.sectionName.value=si===null?'':data.sections[si].title;els.deleteSection.hidden=si===null;els.sectionDialog.showModal()}
els.itemForm.onsubmit=async e=>{e.preventDefault();const osi=+els.oldSection.value,raw=els.oldItem.value,ii=raw===''?null:+raw,nsi=+els.itemSection.value,it={name:els.itemName.value.trim(),note:els.itemNote.value.trim(),price:els.itemPrice.value.trim(),url:els.itemUrl.value.trim(),priority:els.itemPriority.value,done:ii===null?false:data.sections[osi].items[ii].done};if(ii!==null)data.sections[osi].items.splice(ii,1);data.sections[nsi].items.push(it);els.itemDialog.close();await save()};
els.deleteItem.onclick=async()=>{const si=+els.oldSection.value,ii=+els.oldItem.value;if(confirm('Delete this item?')){data.sections[si].items.splice(ii,1);els.itemDialog.close();await save()}};
els.sectionForm.onsubmit=async e=>{e.preventDefault();const i=els.sectionIndex.value,name=els.sectionName.value.trim();if(i==='')data.sections.push({title:name,items:[]});else data.sections[+i].title=name;els.sectionDialog.close();await save()};
els.deleteSection.onclick=async()=>{const i=+els.sectionIndex.value;if(confirm('Delete this section and all its items?')){data.sections.splice(i,1);els.sectionDialog.close();await save()}};
els.cancelItem.onclick=()=>els.itemDialog.close();els.cancelSection.onclick=()=>els.sectionDialog.close();els.addSection.onclick=()=>openSection();els.addItem.onclick=()=>openItem(0);
try{db=getFirestore(initializeApp(cfg));ref=doc(db,'checklists','teo');onSnapshot(ref,async snap=>{if(!snap.exists()){els.status.textContent='No data found';data={sections:[]};render();return}const raw=snap.data();const sections=convert(raw);data={sections};els.status.textContent=`Synced · ${sections.reduce((n,s)=>n+s.items.length,0)} items`;render();if(sections.length&&!Array.isArray(raw.sections))await setDoc(ref,data)},err=>{console.error(err);els.status.textContent='Firebase error';els.app.innerHTML=`<div class="error">${esc(err.message)}</div>`})}catch(err){console.error(err);els.status.textContent='App error';els.app.innerHTML=`<div class="error">${esc(err.message)}</div>`}
</script>
</body></html>
