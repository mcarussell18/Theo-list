<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teo Checklist</title><style>body{margin:0;background:#f8fafc;color:#111827;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{position:sticky;top:0;z-index:9;background:#fffffff2;backdrop-filter:blur(10px);border-bottom:1px solid #e5e7eb}.w,main{max-width:760px;margin:auto}.w{padding:14px}main{padding:12px}h1{font-size:1.35rem;margin:0 0 8px}.top{display:flex;gap:10px;align-items:center}progress{height:9px;flex:1;accent-color:#16a34a}.muted,#count,#status{font-size:.82rem;color:#6b7280}.actions{display:flex;gap:8px;overflow:auto;padding-top:10px}button{border:1px solid #e5e7eb;background:white;border-radius:999px;padding:8px 12px;font-weight:750;white-space:nowrap}.danger{color:#dc2626}.primary{background:#111827;color:white}.sec{background:white;border:1px solid #e5e7eb;border-radius:18px;margin-bottom:10px;overflow:hidden}summary{list-style:none;padding:14px 16px;font-weight:850;display:flex;justify-content:space-between}.badge{font-size:.78rem;color:#6b7280}.note{font-size:.83rem;color:#6b7280;padding:0 16px 10px;white-space:pre-wrap}.grp{padding:0 12px 12px}.gt{font-size:.78rem;color:#6b7280;font-weight:850;text-transform:uppercase;letter-spacing:.06em;margin:10px 4px}.row{display:flex;gap:10px;align-items:flex-start;border-top:1px solid #f1f5f9;padding:11px 4px;cursor:pointer}.row:first-child{border-top:0}input[type=checkbox]{width:22px;height:22px;accent-color:#16a34a}.body{flex:1;min-width:0}.ttl{line-height:1.3}.done .ttl{text-decoration:line-through;color:#6b7280}.meta{display:none;margin-top:7px;font-size:.86rem;color:#6b7280;white-space:pre-wrap;background:#f8fafc;border:1px solid #eef2f7;border-radius:12px;padding:9px}.row.open .meta{display:block}.meta a,.note a{color:#2563eb;font-weight:800;text-decoration:none}.chev{font-size:.8rem;color:#9ca3af;padding-top:3px}.row.open .chev{transform:rotate(90deg)}.eb{display:flex;gap:6px;flex-wrap:wrap;padding:8px 4px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:end;padding:12px;z-index:20}.modal.on{display:flex}.box{background:white;border-radius:22px 22px 14px 14px;width:100%;max-width:600px;margin:auto;padding:16px}label{font-size:.84rem;font-weight:800;color:#6b7280}input.txt,textarea{width:100%;box-sizing:border-box;border:1px solid #e5e7eb;border-radius:12px;padding:10px;margin:5px 0 12px;font:inherit}textarea{min-height:90px}.err{display:none;background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:12px;padding:10px;margin-top:10px}@media(min-width:700px){.modal{align-items:center}.box{border-radius:22px}}</style></head><body><header><div class="w"><h1>Checklist for Teo ✅</h1><div class="top"><progress id="prog" max="100"></progress><span id="count">Loading…</span></div><div id="status">Connecting…</div><div class="actions"><button id="addSec">Add section</button><button id="backup">Back up</button><button id="reload">Reload</button></div><div class="muted">Uses the original Firestore schema. No automatic conversion.</div><div id="err" class="err"></div></div></header><main id="app"></main><div class="modal" id="modal"><div class="box"><h2 id="mh">Edit</h2><label>Name</label><input class="txt" id="nm"><label>Notes / things to consider</label><textarea id="nt"></textarea><label>Link</label><input class="txt" id="ur" placeholder="https://..."><div class="actions"><button class="primary" id="save">Save</button><button id="del" class="danger">Delete</button><button id="close">Cancel</button></div></div></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';import{getFirestore,doc,onSnapshot,setDoc,getDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';const cfg={apiKey:'AIzaSyAhs2ANKnzeaGtlMA89FOuM5TiEpjTWTRQ',authDomain:'teo-checklist.firebaseapp.com',projectId:'teo-checklist',storageBucket:'teo-checklist.firebasestorage.app',messagingSenderId:'174394084827',appId:'1:174394084827:web:2ed6db19c135cb25362bfe'};const db=getFirestore(initializeApp(cfg)),ref=doc(db,'checklists','teo');let data=[],tar=null,timer=null,saving=false,openRows=new Set();const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function ensure(){data=(data||[]).map(s=>({...s,n:s.n||'',u:s.u||'',g:(s.g||[]).map(g=>({...g,n:g.n||'',u:g.u||'',i:(g.i||[]).map(x=>Array.isArray(x)?{t:x[0],d:!!x[1],n:'',u:''}:{t:x.t||'',d:x.d===true,n:x.n||'',u:x.u||''})}))}))}function er(m){$('#err').style.display='block';$('#err').textContent=m}function ok(){$('#err').style.display='none'}function lk(u){return u?'<br><a target="_blank" rel="noopener" href="'+esc(u)+'">Open link</a>':''}function cnt(s){const a=s.g.flatMap(g=>g.i);return[a.filter(x=>x.d===true).length,a.length]}function obj(el){const d=el.dataset;if(d.k==='s')return data[d.s];if(d.k==='g')return data[d.s].g[d.g];return data[d.s].g[d.g].i[d.i]}function rid(si,gi,ii){return si+'-'+gi+'-'+ii}function render(){ensure();app.innerHTML='';let all=[];data.forEach((s,si)=>{const c=cnt(s);all.push(...s.g.flatMap(g=>g.i));const el=document.createElement('details');el.className='sec';el.open=true;el.innerHTML='<summary data-k="s" data-s="'+si+'"><span>'+esc(s.t)+'</span><span class="badge">'+c[0]+'/'+c[1]+'</span></summary>'+((s.n||s.u)?'<div class="note">'+esc(s.n)+lk(s.u)+'</div>':'');s.g.forEach((g,gi)=>{const div=document.createElement('div');div.className='grp';div.innerHTML=(g.t?'<div class="gt" data-k="g" data-s="'+si+'" data-g="'+gi+'">'+esc(g.t)+'</div>'+((g.n||g.u)?'<div class="note">'+esc(g.n)+lk(g.u)+'</div>':''):'')+g.i.map((it,ii)=>{const id=rid(si,gi,ii),meta=(it.n||it.u)?'<div class="meta">'+esc(it.n)+lk(it.u)+'</div>':'<div class="meta">No extra notes or link yet.</div>';return '<div class="row '+(it.d===true?'done ':'')+(openRows.has(id)?'open':'')+'" data-k="i" data-s="'+si+'" data-g="'+gi+'" data-i="'+ii+'"><input type="checkbox" '+(it.d===true?'checked':'')+'><div class="body"><div class="ttl">'+esc(it.t)+'</div>'+meta+'</div><div class="chev">›</div></div>'}).join('')+'<div class="eb"><button data-ai="'+si+','+gi+'">Add item</button></div>';el.appendChild(div)});el.innerHTML+='<div class="eb"><button data-ag="'+si+'">Add header</button><button class="danger" data-ds="'+si+'">Remove section</button></div>';app.appendChild(el)});const done=all.filter(x=>x.d===true).length;prog.value=all.length?done/all.length*100:0;count.textContent=done+'/'+all.length+' done'}async function save(){try{saving=true;status.textContent='Saving…';await setDoc(ref,{data,updatedAt:serverTimestamp()},{merge:false});status.textContent='Saved and synced';ok()}catch(e){er(e.message);status.textContent='Save failed'}finally{saving=false}}async function backup(){try{const snap=await getDoc(ref);if(!snap.exists())throw new Error('No checklist document found');const current=snap.data(),stamp=new Date().toISOString().replace(/[:.]/g,'-');await setDoc(doc(db,'checklists','backup-manual-'+stamp),{kind:'manual-backup',createdAt:serverTimestamp(),payload:current});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(current,null,2)],{type:'application/json'}));a.download='theo-backup-'+stamp+'.json';a.click();status.textContent='Backup saved and downloaded'}catch(e){er('Backup failed: '+e.message)}}function edit(el){tar=el;const o=obj(el);mh.textContent=el.dataset.k==='i'?'Edit item':'Edit header/section';nm.value=o.t||'';nt.value=o.n||'';ur.value=o.u||'';modal.classList.add('on')}document.addEventListener('pointerdown',ev=>{const el=ev.target.closest('[data-k]');if(!el||ev.target.type==='checkbox'||ev.target.tagName==='A')return;timer=setTimeout(()=>edit(el),650)});document.addEventListener('pointerup',()=>clearTimeout(timer));document.addEventListener('pointercancel',()=>clearTimeout(timer));document.addEventListener('change',ev=>{const r=ev.target.closest('.row');if(r&&ev.target.type==='checkbox'){const d=r.dataset;data[d.s].g[d.g].i[d.i].d=ev.target.checked;render();save()}});document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(b){if(b.dataset.ai){const a=b.dataset.ai.split(',').map(Number),v=prompt('Item name?');if(v){data[a[0]].g[a[1]].i.push({t:v,d:false,n:'',u:''});render();save()}}if(b.dataset.ag){const v=prompt('Header name?','New header');if(v!==null){data[+b.dataset.ag].g.push({t:v,n:'',u:'',i:[]});render();save()}}if(b.dataset.ds&&confirm('Remove section?')){data.splice(+b.dataset.ds,1);render();save()}return}const row=ev.target.closest('.row');if(row&&ev.target.type!=='checkbox'&&ev.target.tagName!=='A'){const d=row.dataset,id=rid(d.s,d.g,d.i);openRows.has(id)?openRows.delete(id):openRows.add(id);render()}});save.onclick=()=>{const o=obj(tar);o.t=nm.value.trim()||'Untitled';o.n=nt.value.trim();o.u=ur.value.trim();modal.classList.remove('on');render();save()};del.onclick=()=>{if(!tar||!confirm('Delete this?'))return;const d=tar.dataset;if(d.k==='s')data.splice(d.s,1);else if(d.k==='g')data[d.s].g.splice(d.g,1);else data[d.s].g[d.g].i.splice(d.i,1);modal.classList.remove('on');render();save()};close.onclick=()=>modal.classList.remove('on');addSec.onclick=()=>{const v=prompt('Section name?','New section');if(v){data.push({t:v,n:'',u:'',g:[{t:'',n:'',u:'',i:[]}]});render();save()}};reload.onclick=()=>location.reload();backup.onclick=backup;onSnapshot(ref,s=>{if(!s.exists()){status.textContent='No checklist found';return}const raw=s.data();if(!Array.isArray(raw.data)){status.textContent='Wrong schema — run rebuild page';er('Expected the original data array at checklists/teo.data.');return}data=raw.data;render();status.textContent=saving?'Saving…':'Live sync connected';ok()},e=>{er(e.message);status.textContent='Firebase error'});</script></body></html>
